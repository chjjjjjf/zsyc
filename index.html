  document.getElementById('stats-scroll').querySelectorAll('.team-cell-clickable').forEach(function(cell) {
    cell.addEventListener('click', function(e) {
      e.stopPropagation();
      showConsultantCustomersByDim(cell.dataset.cons, cell.dataset.dim);
    });
  });
}

// === Analysis (Manager Only) ===
var analysisFilter = { level: 'ALL', consultant: 'ALL', deal: 'ALL', stage: 'ALL', revisit: 'ALL' };
function setAnalysisFilter(type, val) {
  if (type === 'level') analysisFilter.level = val;
  else if (type === 'consultant') analysisFilter.consultant = val;
  else if (type === 'deal') analysisFilter.deal = val;
  else if (type === 'stage') analysisFilter.stage = val;
  else if (type === 'revisit') analysisFilter.revisit = val;
  renderAnalysis();
}

function filterChip(type, val, label, active, color) {
  var c = active ? (color || 'var(--gold)') : 'var(--border)';
  var bg = active ? (color || 'var(--gold)') : '#fff';
  var fg = active ? '#fff' : '#666';
  return '<button onclick="setAnalysisFilter(\'' + type + '\',\'' + val + '\')" style="border:1.5px solid ' + c + ';background:' + bg + ';color:' + fg + ';border-radius:18px;padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap;">' + label + '</button>';
}

function renderAnalysis() {
  var isManager = DB.currentUser && DB.currentUser.role === '销售经理';
  var allCustomers = isManager ? DB.customers : getMyCustomers();
  var consultantSet = {};
  if (isManager) allCustomers.forEach(function(c) { if (c.consultant) consultantSet[c.consultant] = true; });
  var consultantNames = Object.keys(consultantSet).sort();

  var revisitCount = allCustomers.filter(function(c) { return (c.revisitCount || 0) >= 1; }).length;

  var levelChips = ['ALL', 'A', 'B', 'C+', 'C', 'C-', 'D'].map(function(lv) {
    var col = lv === 'ALL' ? 'var(--gold)' : { A: '#e74c3c', B: '#e67e22', 'C+': 'var(--gold)', C: '#888', 'C-': '#555', D: '#1a1a1a' }[lv];
    return filterChip('level', lv, lv === 'ALL' ? '全部' : lv + '级', analysisFilter.level === lv, col);
  }).join('');

  var consultantChips = ['ALL'].concat(consultantNames).map(function(cn) {
    return filterChip('consultant', cn, cn === 'ALL' ? '全部顾问' : cn, analysisFilter.consultant === cn);
  }).join('');

  var dealChips = ['ALL', '认购', '签约', '未成交'].map(function(d) {
    var col = d === '认购' ? '#e67e22' : d === '签约' ? '#2ecc71' : d === '未成交' ? '#888' : 'var(--gold)';
    return filterChip('deal', d, d === 'ALL' ? '全部成交' : d, analysisFilter.deal === d, col);
  }).join('');

  var stageChips = ['ALL'].concat(SALES_STAGES.map(function(s) { return s.key; })).map(function(k) {
    var st = SALES_STAGES.find(function(s) { return s.key === k; });
    var col = k === 'ALL' ? 'var(--gold)' : st.color;
    var label = k === 'ALL' ? '全部阶段' : (st ? st.icon + ' ' + st.label : k);
    return filterChip('stage', k, label, analysisFilter.stage === k, col);
  }).join('');

  var revisitChips = filterChip('revisit', 'ALL', '全部', analysisFilter.revisit === 'ALL')
    + filterChip('revisit', 'ONLY', '仅复访 (' + revisitCount + ')', analysisFilter.revisit === 'ONLY', 'var(--gold)');

  var customers = allCustomers.filter(function(c) {
    if (analysisFilter.level !== 'ALL' && c.level !== analysisFilter.level) return false;
    if (analysisFilter.consultant !== 'ALL' && c.consultant !== analysisFilter.consultant) return false;
    if (analysisFilter.deal !== 'ALL' && (c.dealStatus || '未成交') !== analysisFilter.deal) return false;
    if (analysisFilter.stage !== 'ALL' && (c.salesStage || '问询') !== analysisFilter.stage) return false;
    if (analysisFilter.revisit === 'ONLY' && (c.revisitCount || 0) < 1) return false;
    return true;
  });
  customers.sort(function(a, b) {
    var order = { A: 0, B: 1, C: 2, D: 3 };
    var la = order[a.level] || 4, lb = order[b.level] || 4;
    if (la !== lb) return la - lb;
    if (a.dealStatus === '签约' && b.dealStatus !== '签约') return -1;
    if (b.dealStatus === '签约' && a.dealStatus !== '签约') return 1;
    if (a.dealStatus === '认购' && b.dealStatus !== '认购') return -1;
    if (b.dealStatus === '认购' && a.dealStatus !== '认购') return 1;
    return 0;
  });

  var filterDesc = [];
  if (analysisFilter.level !== 'ALL') filterDesc.push(analysisFilter.level + '级');
  if (analysisFilter.consultant !== 'ALL') filterDesc.push(analysisFilter.consultant);
  if (analysisFilter.deal !== 'ALL') filterDesc.push(analysisFilter.deal);
  if (analysisFilter.stage !== 'ALL') filterDesc.push(analysisFilter.stage + '阶段');
  if (analysisFilter.revisit === 'ONLY') filterDesc.push('仅复访');
  var filterText = filterDesc.length ? '（' + filterDesc.join(' · ') + '）' : '';

  var showRevisit = analysisFilter.revisit === 'ONLY';
  var renderRevisitBlock = function(c) {
    var rc = c.revisitCount || 0;
    var fus = (c.followUps || []).slice().reverse().slice(0, 5);
    var items = fus.length > 0
      ? fus.map(function(f) { return '· ' + (f.time ? f.time.slice(0, 10) : '') + ' ' + (f.method || '') + '：' + (f.content || '（无备注）'); }).join('<br>')
      : '暂无跟进记录';
    return '<div style="margin:-4px 12px 10px;padding:8px 10px;background:#fff8ec;border-left:3px solid #ff6b35;border-radius:0 0 6px 6px;font-size:13px;color:#7a5c10;line-height:1.6;">🔥 复访 <strong>' + rc + '</strong> 次　跟进记录：<br>' + items + '</div>';
  };

  var listHtml = customers.length > 0
    ? customers.map(function(c) { return renderCustomerCard(c) + (showRevisit ? renderRevisitBlock(c) : ''); }).join('')
    : '<div class="empty-state"><div class="es-icon">🔍</div><p>无符合条件的客户</p></div>';

  var html =
    '<div style="padding:14px 16px;font-size:16px;font-weight:700;color:var(--gold);">📋 客户梳理表</div>' +
    renderComparisonTable() +
    '<div style="padding:4px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按等级</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + levelChips + '</div></div>' +
    (consultantNames.length > 1 ? '<div style="padding:12px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按顾问</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + consultantChips + '</div></div>' : '') +
    '<div style="padding:12px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按成交状态</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + dealChips + '</div></div>' +
    '<div style="padding:12px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按销售阶段</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + stageChips + '</div></div>' +
    '<div style="padding:12px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按复访</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + revisitChips + '</div></div>' +
    '<div class="section-title" style="margin-top:16px;padding:0 16px;">📇 客户列表' + filterText + ' · 共 ' + customers.length + ' 位</div>' +
    listHtml;

  document.getElementById('analysis-scroll').innerHTML = html;

  // Event delegation for customer cards (supports quick follow-up button)
  document.getElementById('analysis-scroll').onclick = function(e) {
    var qfBtn = e.target.closest('.card-qf-btn');
    if (qfBtn) { e.stopPropagation(); showQuickFollowupOverlay(qfBtn.dataset.qfId); return; }
    var card = e.target.closest('.customer-card');
    if (card) { openDetail(card.dataset.id); }
  };
}

// === Comparison Table ===
var _compY1, _compM1, _compY2, _compM2;

function getComparisonData(y1, m1, y2, m2) {
  var now = new Date();
  if (y1 == null) { y1 = now.getFullYear(); m1 = now.getMonth() + 1; }
  if (y2 == null) { y2 = m1 === 1 ? y1 - 1 : y1; m2 = m1 === 1 ? 12 : m1 - 1; }

  function fmtYM(y, m) { return y + '-' + (m < 10 ? '0' : '') + m; }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

  var start1 = fmtYM(y1, m1) + '-01';
  var end1 = fmtYM(y1, m1) + '-' + (daysInMonth(y1, m1) < 10 ? '0' : '') + daysInMonth(y1, m1);
  var start2 = fmtYM(y2, m2) + '-01';
  var end2 = fmtYM(y2, m2) + '-' + (daysInMonth(y2, m2) < 10 ? '0' : '') + daysInMonth(y2, m2);

  var isManager = DB.currentUser && DB.currentUser.role === '销售经理';
  var customers = isManager ? DB.customers : getMyCustomers();

  var new1 = customers.filter(function(c) { return c.createdAt >= start1 && c.createdAt <= end1; }).length;
  var new2 = customers.filter(function(c) { return c.createdAt >= start2 && c.createdAt <= end2; }).length;

  var visit1 = 0, visit2 = 0;
  customers.forEach(function(c) {
    (c.followUps || []).forEach(function(f) {
      if (f.method === '来访' && f.time) {
        var d = f.time.slice(0, 10);
        if (d >= start1 && d <= end1) visit1++;
        if (d >= start2 && d <= end2) visit2++;
      }
    });
  });

  var sub1 = customers.filter(function(c) { return c.dealStatus === '认购' && c.dealDate && c.dealDate >= start1 && c.dealDate <= end1; }).length;
  var sub2 = customers.filter(function(c) { return c.dealStatus === '认购' && c.dealDate && c.dealDate >= start2 && c.dealDate <= end2; }).length;

  var sign1 = customers.filter(function(c) { return c.dealStatus === '签约' && c.dealDate && c.dealDate >= start1 && c.dealDate <= end1; }).length;
  var sign2 = customers.filter(function(c) { return c.dealStatus === '签约' && c.dealDate && c.dealDate >= start2 && c.dealDate <= end2; }).length;

  var deal1 = sub1 + sign1;
  var deal2 = sub2 + sign2;

  var rate1 = new1 > 0 ? deal1 / new1 * 100 : 0;
  var rate2 = new2 > 0 ? deal2 / new2 * 100 : 0;

  return {
    label1: y1 + '年' + m1 + '月',
    label2: y2 + '年' + m2 + '月',
    rows: [
      { label: '新增客户', v1: new1, v2: new2 },
      { label: '来访量', v1: visit1, v2: visit2 },
      { label: '认购数', v1: sub1, v2: sub2 },
      { label: '签约数', v1: sign1, v2: sign2 },
      { label: '成交总数', v1: deal1, v2: deal2 },
      { label: '成交率', v1: rate1, v2: rate2, suffix: '%', decimals: 1 }
    ]
  };
}

function renderComparisonTable() {
  var y1 = _compY1, m1 = _compM1, y2 = _compY2, m2 = _compM2;
  var d = getComparisonData(y1, m1, y2, m2);
  function arrow(tv, lv) {
    if (tv > lv) return '<span style="color:#2ecc71">↑</span>';
    if (tv < lv) return '<span style="color:#e74c3c">↓</span>';
    return '<span style="color:var(--text-dim)">—</span>';
  }
  function changeStr(tv, lv, decimals, suffix) {
    var diff = tv - lv;
    var abs = Math.abs(diff);
    var dec = decimals || 0;
    var suf = suffix || '';
    if (diff > 0) return '<span style="color:#2ecc71">+' + abs.toFixed(dec) + suf + '</span>';
    if (diff < 0) return '<span style="color:#e74c3c">-' + abs.toFixed(dec) + suf + '</span>';
    return '<span style="color:var(--text-dim)">0</span>';
  }
  function fmtVal(v, decimals, suffix) {
    return (decimals ? v.toFixed(decimals) : v) + (suffix || '');
  }

  var rowsHtml = d.rows.map(function(r) {
    var dec = r.decimals || 0, suf = r.suffix || '';
    return '<tr>' +
      '<td style="padding:8px 12px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border);">' + escHtml(r.label) + '</td>' +
      '<td style="padding:8px 12px;font-size:13px;color:var(--text);text-align:center;border-bottom:1px solid var(--border);">' + fmtVal(r.v1, dec, suf) + '</td>' +
      '<td style="padding:8px 12px;font-size:13px;color:var(--text-dim);text-align:center;border-bottom:1px solid var(--border);">' + fmtVal(r.v2, dec, suf) + '</td>' +
      '<td style="padding:8px 12px;font-size:13px;text-align:center;border-bottom:1px solid var(--border);">' + arrow(r.v1, r.v2) + ' ' + changeStr(r.v1, r.v2, dec, suf) + '</td>' +
    '</tr>';
  }).join('');

  var bodyVisible = _compY1 != null ? 'block' : 'none';
  return '<div style="margin:16px 16px 0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;">' +
    '<div id="monthly-comp-toggle" style="padding:12px 14px;font-size:14px;font-weight:600;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;" onclick="var t=document.getElementById(\'monthly-comp-body\');var a=document.getElementById(\'monthly-comp-arrow\');if(t.style.display===\'none\'){t.style.display=\'block\';a.textContent=\'▾\';}else{t.style.display=\'none\';a.textContent=\'▸\';}">' +
    '<span>📊 月度数据对比 · ' + escHtml(d.label1) + ' vs ' + escHtml(d.label2) + '</span><span style="display:flex;align-items:center;gap:8px;"><span style="font-size:20px;cursor:pointer;padding:0 4px;" onclick="event.stopPropagation();showMonthPicker()" title="更换月份">📅</span><span id="monthly-comp-arrow">' + (bodyVisible === 'block' ? '▾' : '▸') + '</span></span>' +
    '</div>' +
    '<div id="monthly-comp-body" style="display:' + bodyVisible + ';">' +
    '<table style="width:100%;border-collapse:collapse;">' +
    '<thead><tr>' +
      '<th style="padding:8px 12px;font-size:11px;color:var(--text-dim);text-align:left;border-bottom:1px solid var(--border);">指标</th>' +
      '<th style="padding:8px 12px;font-size:11px;color:var(--text-dim);text-align:center;border-bottom:1px solid var(--border);">' + escHtml(d.label1) + '</th>' +
      '<th style="padding:8px 12px;font-size:11px;color:var(--text-dim);text-align:center;border-bottom:1px solid var(--border);">' + escHtml(d.label2) + '</th>' +
      '<th style="padding:8px 12px;font-size:11px;color:var(--text-dim);text-align:center;border-bottom:1px solid var(--border);">变化</th>' +
    '</tr></thead>' +
    '<tbody>' + rowsHtml + '</tbody>' +
    '</table></div></div>';
}

function showMonthPicker() {
  var now = new Date();
  var cy = now.getFullYear(), cm = now.getMonth() + 1;
  window._pickerY = cy;

  function renderPickerGrid() {
    var pkY = window._pickerY || cy;
    var monthsHtml = '';
    for (var m = 1; m <= 12; m++) {
      var isFuture = pkY > cy || (pkY === cy && m > cm);
      var sel1 = _compY1 === pkY && _compM1 === m ? '3px solid var(--gold)' : '1px solid var(--border)';
      var sel2 = _compY2 === pkY && _compM2 === m ? '3px solid var(--gold)' : '1px solid var(--border)';
      var style = isFuture ? 'opacity:0.3;pointer-events:none;' : 'cursor:pointer;';
      monthsHtml += '<div style="text-align:center;">' +
        '<button style="width:100%;padding:10px 4px;border:' + sel1 + ';border-radius:8px 8px 0 0;background:var(--card);font-size:13px;' + style + 'color:var(--text);" onclick="pickCompareMonth(1,' + pkY + ',' + m + ')">' + m + '月</button>' +
        '<button style="width:100%;padding:4px;border:' + sel2 + ';border-top:none;border-radius:0 0 8px 8px;background:var(--card);font-size:10px;' + style + 'color:var(--text-dim);" onclick="pickCompareMonth(2,' + pkY + ',' + m + ')">对比</button>' +
        '</div>';
    }
    document.getElementById('picker-months-grid').innerHTML = monthsHtml;
    document.getElementById('picker-year-label').textContent = pkY + '年';
    document.getElementById('picker-prev-year').disabled = pkY <= cy - 3;
  }

      '<div id="picker-months-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 14px 14px;"></div>' +

      '</div>' +

}

window.renderPickerGrid = function() {
  var pkY = window._pickerY || new Date().getFullYear();
  var cy = new Date().getFullYear(), cm = new Date().getMonth() + 1;
  var monthsHtml = '';
  for (var m = 1; m <= 12; m++) {
    var isFuture = pkY > cy || (pkY === cy && m > cm);
    var sel1 = _compY1 === pkY && _compM1 === m ? '3px solid var(--gold)' : '1px solid var(--border)';
    var sel2 = _compY2 === pkY && _compM2 === m ? '3px solid var(--gold)' : '1px solid var(--border)';
    var style = isFuture ? 'opacity:0.3;pointer-events:none;' : 'cursor:pointer;';
    monthsHtml += '<div style="text-align:center;">' +
      '<button style="width:100%;padding:10px 4px;border:' + sel1 + ';border-radius:8px 8px 0 0;background:var(--card);font-size:13px;' + style + 'color:var(--text);" onclick="pickCompareMonth(1,' + pkY + ',' + m + ')">' + m + '月</button>' +
      '<button style="width:100%;padding:4px;border:' + sel2 + ';border-top:none;border-radius:0 0 8px 8px;background:var(--card);font-size:10px;' + style + 'color:var(--text-dim);" onclick="pickCompareMonth(2,' + pkY + ',' + m + ')">对比</button>' +
      '</div>';
  }
  var grid = document.getElementById('picker-months-grid');
  if (grid) grid.innerHTML = monthsHtml;
  var label = document.getElementById('picker-year-label');
  if (label) label.textContent = pkY + '年';
  var prevBtn = document.getElementById('picker-prev-year');
  if (prevBtn) prevBtn.disabled = pkY <= cy - 3;
};

function pickCompareMonth(slot, y, m) {
  if (slot === 1) { window._p1y = y; window._p1m = m; }
  else { window._p2y = y; window._p2m = m; }
  var sel1 = document.getElementById('picker-sel1');
  var sel2 = document.getElementById('picker-sel2');
  if (sel1 && window._p1y != null) sel1.textContent = window._p1y + '年' + window._p1m + '月';
  if (sel2 && window._p2y != null) sel2.textContent = window._p2y + '年' + window._p2m + '月';
  // Re-render grid to update borders
  if (window.renderPickerGrid) window.renderPickerGrid();
}

function applyMonthCompare() {
  var now = new Date();
  var p1y = window._p1y, p1m = window._p1m;
  var p2y = window._p2y, p2m = window._p2m;
  if (p1y == null) { p1y = _compY1 || now.getFullYear(); p1m = _compM1 || now.getMonth() + 1; }
  if (p2y == null) { p2y = _compY2 || (p1m === 1 ? p1y - 1 : p1y); p2m = _compM2 || (p1m === 1 ? 12 : p1m - 1); }
  _compY1 = p1y; _compM1 = p1m;
  _compY2 = p2y; _compM2 = p2m;
  window._p1y = null; window._p1m = null; window._p2y = null; window._p2m = null;
  var overlay = document.getElementById('month-picker-overlay');
  if (overlay) overlay.remove();
  renderAnalysis();
}

function exportData() {
  var dataStr = JSON.stringify(DB, null, 2);
  var blob = new Blob([dataStr], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '中山御宸客户档案_' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出', 'success');
}

function importData() {
  var file = document.getElementById('import-file').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.customers || !Array.isArray(data.customers)) { toast('文件格式不正确', 'error'); return; }
      confirmDlg('导入确认', '将导入 ' + data.customers.length + ' 条客户记录，是否覆盖现有数据？', function() {
        DB.customers = data.customers;
        saveDB();
        toast('成功导入 ' + data.customers.length + ' 条记录', 'success');
        navigateTo('workbench');
      });
    } catch(err) { toast('文件解析失败', 'error'); }
  };
  reader.readAsText(file);
  document.getElementById('import-file').value = '';
}

function restoreMergeData() {
  var file = document.getElementById('restore-file').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.customers || !Array.isArray(data.customers)) { toast('文件格式不正确，需要包含 customers 数组', 'error'); return; }
      var backupCustomers = data.customers;
      var existingPhones = {};
      DB.customers.forEach(function(c) { existingPhones[c.phone] = c; });
      var conflicts = backupCustomers.filter(function(c) { return existingPhones[c.phone]; });
      var newOnly = backupCustomers.filter(function(c) { return !existingPhones[c.phone]; });
      if (conflicts.length === 0) {
        confirmDlg('恢复备份', '备份中有 ' + newOnly.length + ' 条新记录，无电话冲突。直接导入？', function() {
          DB.customers = DB.customers.concat(newOnly);
          saveDB(); toast('成功导入 ' + newOnly.length + ' 条新记录', 'success');
          navigateTo('workbench');
        });
      } else {
        var msg = '备份共 ' + backupCustomers.length + ' 条记录。<br><br>' +
          '🆕 新记录：' + newOnly.length + ' 条<br>' +
          '⚠️ 电话冲突：' + conflicts.length + ' 条（系统中已存在相同电话的客户）<br><br>' +
          '请选择处理方式：';
        var overlay = document.getElementById('detail-overlay');
        overlay.innerHTML = '<div style="position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);padding:16px;" onclick="if(event.target===this)this.parentNode.style.display=\'none\'">' +
          '<div style="background:#fff;border-radius:16px;padding:24px 20px;max-width:400px;width:100%;">' +
            '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;">🔄 恢复备份</div>' +
            '<div style="font-size:13px;color:var(--text-dim);margin-bottom:16px;">' + msg + '</div>' +
            '<div style="display:flex;flex-direction:column;gap:8px;">' +
              '<button onclick="restoreMergeSkip()" style="padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;cursor:pointer;">跳过冲突（仅导入新记录）</button>' +
              '<button onclick="restoreMergeOverwrite()" style="padding:12px;border-radius:10px;border:none;background:var(--gold);color:#111;font-size:14px;font-weight:600;cursor:pointer;">覆盖冲突（以备份为准）</button>' +

  };
  reader.readAsText(file);
  document.getElementById('restore-file').value = '';
}

function restoreMergeSkip() {
  var overlay = document.getElementById('detail-overlay');
  var newOnly = overlay._restoreNew || [];
  DB.customers = DB.customers.concat(newOnly);
  saveDB(); toast('成功导入 ' + newOnly.length + ' 条新记录（跳过冲突）', 'success');
  overlay.style.display = 'none'; navigateTo('workbench');
}

function restoreMergeOverwrite() {
  var overlay = document.getElementById('detail-overlay');
  var newOnly = overlay._restoreNew || [];
  var conflicts = overlay._restoreConflicts || [];
  var conflictPhones = {};
  conflicts.forEach(function(c) { conflictPhones[c.phone] = true; });
  DB.customers = DB.customers.filter(function(c) { return !conflictPhones[c.phone]; });
  DB.customers = DB.customers.concat(newOnly).concat(conflicts);
  saveDB(); toast('成功导入 ' + (newOnly.length + conflicts.length) + ' 条记录（已覆盖冲突）', 'success');
  overlay.style.display = 'none'; navigateTo('workbench');
}

      '</div></div>' +

      '<div style="margin-bottom:16px;"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;">下次跟进日期</label><input type="date" id="qf-next-q" value="' + defaultNext + '" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;color:var(--text);"></div>' +

function closeQFOverlay() {
  var overlay = document.getElementById('quick-followup-overlay');
  if (overlay) overlay.style.display = 'none';
}

function submitQuickFollowup(cid) {
  var c = DB.customers.find(function(x) { return x.id === cid; });
  if (!c) { toast('客户不存在', 'error'); return; }
  var method = (document.querySelector('input[name="qf-method"]:checked') || {}).value || '来访';
  var content = (document.getElementById('qf-content-q').value || '').trim();
  var nextDate = (document.getElementById('qf-next-q').value || '').trim();
  if (!content) { toast('请填写跟进内容', 'error'); return; }
  addFollowUp(c, method, content, nextDate);
  saveDB(); toast('跟进已记录', 'success');
  closeQFOverlay();
  // Refresh current view
  if (currentTab === 'workbench') renderWorkbench();
  else if (currentTab === 'customers') renderCustomerList();
  else if (currentTab === 'analysis') renderAnalysis();
  else if (currentTab === 'stats') renderStats();
}

function closeDetail() {
  document.getElementById('detail-page').classList.remove('active');
  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('bottom-nav').classList.remove('hidden');
  document.getElementById('topbar-title').textContent = getTabTitle(currentTab);
  showTab(currentTab);
}

function changeRevisit(cid, delta) {
  var c = DB.customers.find(function(x) { return x.id === cid; });
  if (!c) return;
  c.revisitCount = Math.max(0, (c.revisitCount || 0) + delta);
  saveDB();
  var el = document.getElementById('rv-count-' + cid.replace(/[^a-zA-Z0-9]/g, ''));
  if (el) el.textContent = c.revisitCount;

function isUnitSold(building, unit) {
  if (!DB.soldUnits) DB.soldUnits = {};
  return !!DB.soldUnits[building + '-' + unit];
}
function markUnitSold(building, unit, customerId) {
  if (!DB.soldUnits) DB.soldUnits = {};
  DB.soldUnits[building + '-' + unit] = { soldAt: today(), soldTo: customerId };
  saveDB();
}
function markUnitAvailable(building, unit) {
  if (!DB.soldUnits) DB.soldUnits = {};
  delete DB.soldUnits[building + '-' + unit];
  saveDB();
}

var _pcCurrentId = null;
var _pcOnSave = null;
var _pcSelectedBuilding = null;
var _pcSelectedUnit = null;

function openPriceCalc(customerId, onSave) {
  if (!customerId) { toast('请先保存客户', 'error'); return; }
  _pcCurrentId = customerId;
  _pcOnSave = onSave || null;
  var c = DB.customers.find(function(x) { return x.id === customerId; });
  if (!c) return;
  var ex = c.calculatedPrice || {};
  _pcSelectedBuilding = ex.building || null;
  _pcSelectedUnit = ex.unit || null;
  renderPriceCalc(c, ex);
}

function renderPriceCalc(c, ex) {
  var bldNames = ['1栋','2栋','3栋','4栋','5栋','6栋'];
  var bldHtml = bldNames.map(function(bld) {
    var units = BUILDING_DATA[bld];
    var unitKeys = Object.keys(units);
    var allSold = unitKeys.length > 0 && unitKeys.every(function(u) { return isUnitSold(bld, u); });
    var isSel = _pcSelectedBuilding === bld;
    var bg = allSold ? '#e8e8e8' : (isSel ? 'rgba(184,148,46,0.2)' : '#fff');
    var border = allSold ? 'var(--border)' : (isSel ? 'var(--gold)' : 'var(--border)');
    var color = allSold ? '#bbb' : (isSel ? 'var(--gold)' : '#333');
    var cursor = allSold ? 'default' : 'pointer';
    return '<div onclick="' + (allSold ? 'return' : 'selectBuilding(\'' + bld + '\',\'' + c.id + '\')') + '" style="cursor:' + cursor + ';padding:10px 14px;background:' + bg + ';border:2px solid ' + border + ';border-radius:10px;text-align:center;font-size:14px;font-weight:600;color:' + color + ';transition:all 0.15s;">' + bld + (allSold ? ' (售罄)' : '') + '</div>';
  }).join('');

  var unitHtml = '';
  if (_pcSelectedBuilding) {
    var bldUnits = BUILDING_DATA[_pcSelectedBuilding];
    var ukeys = Object.keys(bldUnits);
    var col01 = ukeys.filter(function(u) { return bldUnits[u].type === '01'; }).sort();
    var col02 = ukeys.filter(function(u) { return bldUnits[u].type === '02'; }).sort();
    var renderUnitCol = function(units, label) {
      var h = '<div style="flex:1;min-width:0;"><div style="font-size:11px;color:var(--text-dim);font-weight:600;margin-bottom:6px;text-align:center;">' + label + '</div>';
      if (units.length === 0) { h += '<div style="color:#ccc;text-align:center;font-size:12px;">无</div>'; }
      else {
        units.forEach(function(u) {
          var sold = isUnitSold(_pcSelectedBuilding, u);
          var isSel = _pcSelectedUnit === u;
          var bg = sold ? '#e8e8e8' : (isSel ? 'rgba(184,148,46,0.2)' : '#fff');
          var border = sold ? 'var(--border)' : (isSel ? 'var(--gold)' : 'var(--border)');
          var color = sold ? '#bbb' : (isSel ? 'var(--gold)' : '#333');
          var cursor = sold ? 'default' : 'pointer';
          h += '<div onclick="' + (sold ? 'return' : 'selectUnit(\'' + u + '\',\'' + c.id + '\')') + '" style="cursor:' + cursor + ';padding:8px 10px;margin-bottom:4px;background:' + bg + ';border:1.5px solid ' + border + ';border-radius:8px;text-align:center;font-size:13px;font-weight:600;color:' + color + ';transition:all 0.15s;">' + fmtUnit(u) + '<div style="font-size:10px;font-weight:400;color:' + (sold ? '#ccc' : 'var(--text-dim)') + ';">' + bldUnits[u].area + '㎡</div></div>';
        });
      }
      h += '</div>';
      return h;
    };
    unitHtml = '<div style="display:flex;gap:10px;margin-bottom:12px;">' + renderUnitCol(col01, '01户型') + renderUnitCol(col02, '02户型') + '</div>';
  }

  var selInfo = '';
  if (_pcSelectedBuilding && _pcSelectedUnit) {
    var uArea = BUILDING_DATA[_pcSelectedBuilding][_pcSelectedUnit].area;
    selInfo = '<div style="background:rgba(184,148,46,0.1);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;">已选：<b style="color:var(--gold);">' + _pcSelectedBuilding + ' ' + fmtUnit(_pcSelectedUnit) + '</b>　面积：<b>' + uArea + '㎡</b></div>';
  }

  var unitPriceHtml = '';
  if (ex.price && ex.area) {
    unitPriceHtml = '<div style="margin-bottom:12px;"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:4px;">单价</label><div style="font-size:16px;font-weight:700;color:var(--gold);">' + (Math.round(ex.price / ex.area * 100) / 100).toFixed(2) + ' 元/㎡</div></div>';
  }

  var html = '<div style="position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);padding:16px;" onclick="if(event.target===this)closePriceCalc()">' +
    '<div style="background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;">' +
      '<div style="padding:16px 20px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1;">' +
        '<span style="font-weight:700;font-size:16px;">💰 算价格</span>' +
        '<span onclick="closePriceCalc()" style="font-size:22px;cursor:pointer;line-height:1;">×</span>' +
      '</div>' +
      '<div style="padding:16px 20px;">' +
        '<div style="font-size:13px;color:var(--text-dim);margin-bottom:14px;">客户：<b style="color:#1a1a1a;">' + escRaw(c.name) + '</b>' + (c.area ? '　意向：<b style="color:#1a1a1a;">' + escHtml(c.area) + '㎡</b>' : '') + '</div>' +
        '<div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:8px;">① 选择楼栋</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;">' + bldHtml + '</div>' +
        (_pcSelectedBuilding ? '<div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:8px;">② 选择户型</div>' + unitHtml : '') +
        selInfo +
        (selInfo ? '<div style="margin-bottom:14px;"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;">③ 输入总价（元）</label><input type="number" id="pc-price" placeholder="如：4280000" value="' + (ex.price || '') + '" oninput="calcUnitPrice()" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;"></div>' +
          '<div style="margin-bottom:14px;"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:4px;">④ 单价（自动计算）</label><div id="pc-unit-price" style="font-size:16px;font-weight:700;color:var(--gold);padding:8px 12px;background:rgba(184,148,46,0.08);border-radius:8px;">— 元/㎡</div></div>' +
          '<button onclick="savePriceCalc()" style="width:100%;padding:12px;border:none;border-radius:10px;background:var(--gold);color:#fff;font-size:15px;font-weight:700;cursor:pointer;">保存算价结果</button>'
        : '<div style="color:var(--text-dim);font-size:12px;text-align:center;padding:10px;">请选择楼栋和户型</div>') +
      '</div></div></div>';
  var overlay = document.getElementById('price-calc-overlay');
  overlay.innerHTML = html;
  overlay.style.display = 'block';
  if (ex.price && ex.area) { setTimeout(function() { var el = document.getElementById('pc-unit-price'); if (el) el.textContent = (Math.round(ex.price / ex.area * 100) / 100).toFixed(2) + ' 元/㎡'; }, 50); }
}

function selectBuilding(bld, cid) {
  _pcSelectedBuilding = bld;
  _pcSelectedUnit = null;
  var c = DB.customers.find(function(x) { return x.id === cid; });
  if (c) renderPriceCalc(c, c.calculatedPrice || {});
}
function selectUnit(unit, cid) {
  _pcSelectedUnit = unit;
  var c = DB.customers.find(function(x) { return x.id === cid; });
  if (c) renderPriceCalc(c, c.calculatedPrice || {});
}
function calcUnitPrice() {
  var price = parseFloat((document.getElementById('pc-price') || {}).value) || 0;
  var el = document.getElementById('pc-unit-price');
  if (!el || !_pcSelectedBuilding || !_pcSelectedUnit) return;
  var area = BUILDING_DATA[_pcSelectedBuilding][_pcSelectedUnit].area;
  if (price > 0 && area > 0) {
    el.textContent = (Math.round(price / area * 100) / 100).toFixed(2) + ' 元/㎡';
  } else {
    el.textContent = '— 元/㎡';
  }
}
function closePriceCalc() {
  document.getElementById('price-calc-overlay').style.display = 'none';
  _pcCurrentId = null; _pcOnSave = null;
  _pcSelectedBuilding = null; _pcSelectedUnit = null;
}
function savePriceCalc() {
  var cid = _pcCurrentId;
  if (!cid) { toast('客户ID无效', 'error'); return; }
  if (!_pcSelectedBuilding || !_pcSelectedUnit) { toast('请选择楼栋和户型', 'error'); return; }
  var price = parseFloat((document.getElementById('pc-price') || {}).value) || 0;
  if (!price || price <= 0) { toast('请输入有效的总价', 'error'); return; }
  var area = BUILDING_DATA[_pcSelectedBuilding][_pcSelectedUnit].area;
  var unitPrice = Math.round(price / area * 100) / 100;
  var c = DB.customers.find(function(x) { return x.id === cid; });
  if (!c) return;
  c.calculated = true;
  c.calculatedPrice = { building: _pcSelectedBuilding, unit: _pcSelectedUnit, area: area, price: price, unitPrice: unitPrice, date: new Date().toISOString().slice(0, 10) };
  saveDB();
  closePriceCalc();
  if (_pcOnSave) { _pcOnSave(cid); }
  else { openDetail(cid); }
  toast('算价已保存：' + unitPrice.toFixed(2) + '元/㎡', 'success');
}

function submitForm() {
  var customerData = collectFormData();
  if (!customerData.name) { toast('请填写客户姓名', 'error'); return; }
  if (!customerData.phone) { toast('请填写电话号码', 'error'); return; }
  var dup = DB.customers.find(function(c) { return c.phone === customerData.phone && c.id !== (editingCustomer ? editingCustomer.id : ''); });
  if (dup && !_forceCreate) { showDuplicateDialog(dup, customerData); return; }
  _forceCreate = false;
  doSaveCustomer(customerData);
}

function doSaveCustomer(customerData) {

  // Auto-sync dealStatus with salesStage
  if (customerData.salesStage === '签约') {
    customerData.dealStatus = '签约';
    if (!customerData.dealDate) customerData.dealDate = today();
  } else if (customerData.salesStage === '认购') {
    customerData.dealStatus = '认购';
  } else {
    customerData.dealStatus = '未成交';
    customerData.dealDate = '';
  }

  if (DB.currentUser && DB.currentUser.role === '置业顾问') {
    customerData.consultant = DB.currentUser.name;
  }

  if (editingCustomer) {
    // Preserve calculated price data when editing
    if (!customerData.calculatedPrice && editingCustomer.calculatedPrice) {
      customerData.calculatedPrice = editingCustomer.calculatedPrice;
      customerData.calculated = editingCustomer.calculated;
    }
    var idx = DB.customers.findIndex(function(x) { return x.id === editingCustomer.id; });
    if (idx !== -1) DB.customers[idx] = customerData;
  } else {
    DB.customers.push(customerData);
  }
  var newId = customerData.id;
  saveDB();
  toast(editingCustomer ? '修改已保存' : '客户添加成功', 'success');
  // If new customer with 算价=是, keep form open and overlay calculator on top
  if (!editingCustomer && customerData.calculated) {
    openPriceCalc(newId, function() {
      closeForm();
      renderCustomerList();
      renderWorkbench();
    });
  } else {
    closeForm();
    renderCustomerList();
    renderWorkbench();
  }
}

function showTimeFiltered(type, period, label) {
  document.getElementById('detail-overlay').style.display = 'none';
  var todayStr = today();
  var allCs = DB.customers.filter(function(c) { return !c.inPool; });

  // Determine date range
  var startDate = '';
  var now = new Date();
  if (period === 'month') {
    startDate = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-01';
  } else if (period === 'week') {
    var dow = now.getDay() || 7;
    var mon = new Date(now);
    mon.setDate(now.getDate() - dow + 1);
    startDate = fDate(mon);
  } else if (period === 'day') {
    startDate = todayStr;
  }

  var filtered;
  if (period === 'all') {
    filtered = allCs;
  } else if (type === 'visit') {
    // Filter by visit time within period
    filtered = allCs.filter(function(c) {
      return c.visitTime && c.visitTime.slice(0,10) >= startDate;
    });
  } else if (type === 'deal') {
    // Filter by deal date within period
    filtered = allCs.filter(function(c) {
      return (c.dealStatus === '签约' || c.dealStatus === '认购') && c.dealDate && c.dealDate >= startDate;
    });
  }

  // Sort by followup date descending
  filtered.sort(function(a, b) {
    var da = a.followUpDate || '0000-00-00';
    var db = b.followUpDate || '0000-00-00';
    return db.localeCompare(da);
  });

  if (filtered.length === 0) { toast('无符合条件的客户', 'info'); return; }
  renderStatListOverlay(filtered, label + '（' + filtered.length + '人）');
}

  else if (label === 'deal') filtered = myCs.filter(function(c) { return c.dealStatus === '签约' || c.dealStatus === '认购'; });

function exportCustomerSummary() {

  function doExport() {

    var lvOrd = {A:0,B:1,'C+':2,C:3,'C-':4,D:5};
    var sorted = customers.slice().sort(function(a,b) {
      if ((lvOrd[a.level]||9) !== (lvOrd[b.level]||9)) return (lvOrd[a.level]||9) - (lvOrd[b.level]||9);
      return (b.createdAt||'').localeCompare(a.createdAt||'');
    });
    var aoa = [hdrs];
    sorted.forEach(function(c, i) {
      var fu = (c.followUps||[]).slice(0, 5);
      var fuStr = fu.map(function(f) { return (f.time||'').slice(0,10) + ' ' + f.method + '：' + f.content; }).join(' | ');
      aoa.push([

        c.competitor||'', c.job||'', c.calculated?'是':'否',
        (c.soace||'').slice(0,200), (c.resistanceTags||[]).join(', '), (c.solutions||[]).join('; '),
        c.followUpDate||'', fu.length>0?fu[0].method||'':'', fuStr,
        c.revisitCount||0, (c.createdAt||'').slice(0,10),
        c.inPool?'是':'否',
        c.calculatedPrice ? (c.calculatedPrice.building||'') + ' ' + (c.calculatedPrice.price||'') + '元' : ''
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '客户档案');
    XLSX.writeFile(wb, '中山御宸客户档案_' + today + '.xlsx');
    toast('Excel已生成，共' + customers.length + '条记录', 'success');
  }

  if (typeof XLSX !== 'undefined') { doExport(); }
  else {
    window._exportFn = doExport;
    var sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    sc.onload = function() { window._exportFn(); window._exportFn = null; };
    sc.onerror = function() { toast('网络不稳定，请重试', 'error'); };
    document.head.appendChild(sc);
  }
}

var _loginAttempts = 0;
var _loginLockUntil = 0;

function doLogin(name, role) {
  name = (name || '').trim();
  var pwd = (document.getElementById('login-pwd') || { value: '' }).value;
  var err = document.getElementById('login-error');
  if (err) err.style.display = 'none';
  if (!name) { toast('请输入姓名', 'error'); return; }

  // Rate limiting: max 5 attempts, then 30s lockout
  var now = Date.now();
  if (_loginLockUntil > now) {
    var remain = Math.ceil((_loginLockUntil - now) / 1000);
    if (err) { err.textContent = '登录次数过多，请 ' + remain + ' 秒后重试'; err.style.display = 'block'; }
    return;
  }
  if (_loginAttempts >= 5) {
    _loginLockUntil = now + 30000;
    if (err) { err.textContent = '登录次数过多，请30秒后重试'; err.style.display = 'block'; }
    return;
  }

  function loginFailed(msg) {
    _loginAttempts++;
    if (err) { err.textContent = msg || '登录失败'; err.style.display = 'block'; }
    if (_loginAttempts >= 5) {
      _loginLockUntil = Date.now() + 30000;
      if (err) { err.textContent = '登录次数过多，请30秒后重试'; err.style.display = 'block'; }
    }
  }

  // Sales manager login: manager IS admin, has all powers
  if (name === '程华军' && role === '销售经理') {
    var acc = DEMO_ACCOUNTS['程华军'];
    if (!acc || acc.pwd !== pwd) {
      loginFailed('密码错误');
      return;
    }
    _loginAttempts = 0;
    var token = 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
    DB.currentUser = { name: '程华军', role: '销售经理', isAdmin: true, sessionToken: token };
    if (!DB.approvedUsers) DB.approvedUsers = [];
    if (!DB.sessions) DB.sessions = {};
    DB.sessions['程华军'] = token;
    saveDB();
    if (SYNC_ENABLED) syncSessions();
    closeLoginScreen();
    refreshNavForRole();
    enterApp();
    startSessionCheck();
    return;
  }

  // Regular account validation
  var account = DEMO_ACCOUNTS[name];
  if (!account) {
    loginFailed('姓名不在白名单内，请联系管理员');
    return;
  }
  if (account.role !== role) {
    loginFailed('角色与账号不匹配');
    return;
  }
  if (account.disabled) { loginFailed('该账号已被管理员禁用'); return; }
  if (account.pwd !== pwd) {
    loginFailed('密码错误');
    return;
  }
  _loginAttempts = 0;
  if (err) err.style.display = 'none';
  var token = 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  DB.currentUser = { name: name, role: role, sessionToken: token };
  if (!DB.approvedUsers) DB.approvedUsers = [];
  if (!DB.sessions) DB.sessions = {};
  DB.sessions[name] = token;
  saveDB();
  if (SYNC_ENABLED) syncSessions();
  closeLoginScreen();
  refreshNavForRole();
  enterApp();
  startSessionCheck();
  toast('欢迎回来，' + name, 'success');
}

function requestNotificationPermission() {
  if (!('Notification' in window)) return;

  if (Notification.permission === 'denied') { _notifEnabled = false; return; }
  Notification.requestPermission().then(function(perm) { _notifEnabled = (perm === 'granted'); });
}

function checkFollowupNotifications() {
  if (!_notifEnabled || !DB.settings || !DB.settings.followupNotif) return;
  if (!DB.currentUser) return;
  var todayStr = today();
  var myList = DB.currentUser.role === '销售经理'
    ? DB.customers.filter(function(c) { return !c.inPool; })
    : DB.customers.filter(function(c) { return c.consultant === DB.currentUser.name && !c.inPool; });

    } catch(e) {}
  });

function startNotificationTimer() {
  stopNotificationTimer();
  _notifTimer = setInterval(function() {
    if (document.hidden) checkFollowupNotifications();
  }, 5 * 60 * 1000);
  setTimeout(function() { checkFollowupNotifications(); }, 15000);
}

function stopNotificationTimer() {

}

// === Message Push System ===
function getUnreadMsgCount() {
  if (!DB.currentUser || !DB.messages) return 0;
  var name = DB.currentUser.name;
  return DB.messages.filter(function(m) {
    return m.to.indexOf(name) !== -1 && m.readBy.indexOf(name) === -1;
  }).length;
}

function updateMsgBadge() {
  var bell = document.getElementById('msg-bell-btn');
  if (!bell) return;
  var isConsultant = DB.currentUser && DB.currentUser.role === '置业顾问';
  if (!isConsultant) { bell.style.display = 'none'; return; }
  bell.style.display = '';
  var count = getUnreadMsgCount();
  var badge = document.getElementById('msg-badge');
  if (badge) {
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.display = count > 0 ? '' : 'none';
  }
}

function sendPushMsg(toList, content) {
  if (!DB.messages) DB.messages = [];
  var msg = {
    id: 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
    from: DB.currentUser.name,
    to: toList,
    content: content.trim(),
    time: new Date().toISOString(),
    readBy: []
  };
  DB.messages.push(msg);
  // Keep only latest 100 messages
  if (DB.messages.length > 100) DB.messages = DB.messages.slice(-100);
  saveDB();
}

function markMsgRead(msgId) {
  if (!DB.currentUser || !DB.messages) return;
  var msg = DB.messages.find(function(m) { return m.id === msgId; });
  if (msg && msg.readBy.indexOf(DB.currentUser.name) === -1) {
    msg.readBy.push(DB.currentUser.name);
    saveDB();
    updateMsgBadge();
  }
}

function markAllMsgRead() {
  if (!DB.currentUser || !DB.messages) return;
  var name = DB.currentUser.name;
  DB.messages.forEach(function(m) {
    if (m.to.indexOf(name) !== -1 && m.readBy.indexOf(name) === -1) {
      m.readBy.push(name);
    }
  });
  saveDB();
  updateMsgBadge();
}

        '</div>' +
        '<div style="font-size:13px;color:var(--text);">' + escHtml(m.content) + '</div>' +
        (isUnread ? '<div style="text-align:right;margin-top:4px;"><button class="qf-btn mark-read-btn-overlay" data-msg-id="' + m.id + '" style="font-size:10px;padding:2px 8px;">标记已读</button></div>' : '') +
      '</div>';
    }).join('');
  }

  var html = '<div class="msg-overlay" onclick="if(event.target===this)document.getElementById(\'msg-inbox-overlay\').innerHTML=\'\'">' +
    '<div class="msg-panel">' +
      '<div class="msg-panel-header">' +
        '<span>📬 收件箱' + (unreadCount > 0 ? ' <span style="background:#e74c3c;color:#fff;border-radius:50%;width:20px;height:20px;display:inline-block;text-align:center;line-height:20px;font-size:11px;vertical-align:middle;">' + unreadCount + '</span>' : '') + '</span>' +
        '<span style="cursor:pointer;font-size:22px;" onclick="document.getElementById(\'msg-inbox-overlay\').innerHTML=\'\'">×</span>' +
      '</div>' +
      '<div class="msg-panel-body">' +
        (unreadCount > 0 ? '<button class="qf-btn" id="mark-all-read-overlay" style="width:100%;margin-bottom:10px;font-size:12px;">✓ 全部已读</button>' : '') +
        '<div style="max-height:50vh;overflow-y:auto;">' + messagesHtml + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';

  document.getElementById('msg-inbox-overlay').innerHTML = html;

  // Wire mark-all-read
  var markAllBtn = document.getElementById('mark-all-read-overlay');
  if (markAllBtn) {
    markAllBtn.onclick = function() {
      markAllMsgRead();
      openMsgInboxOverlay();
    };
  }

  // Wire message click → mark read
  document.querySelectorAll('.msg-item-overlay').forEach(function(item) {
    item.onclick = function(e) {
      if (e.target.classList.contains('mark-read-btn-overlay')) return;
      markMsgRead(item.dataset.msgId);
      openMsgInboxOverlay();
    };
  });

  // Wire individual mark-read buttons
  document.querySelectorAll('.mark-read-btn-overlay').forEach(function(btn) {
    btn.onclick = function(e) {
      e.stopPropagation();
      markMsgRead(btn.dataset.msgId);
      openMsgInboxOverlay();
    };
  });
}

function startSessionCheck() {
  if (_sessionCheckTimer) clearInterval(_sessionCheckTimer);
  _sessionCheckTimer = setInterval(function() {
    if (!DB.currentUser) { if (_sessionCheckTimer) clearInterval(_sessionCheckTimer); return; }
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var db = JSON.parse(raw);
      if (!db.sessions) return;
      var curToken = db.sessions[DB.currentUser.name];
      if (curToken && DB.currentUser.sessionToken && curToken !== DB.currentUser.sessionToken) {
        forceLogout('该账号已在其他设备登录，您已被迫下线');
      }
    } catch(e) {}
    if (SYNC_ENABLED) checkRemoteSession();
  }, 3000);
}

function forceLogout(msg) {
  if (_sessionCheckTimer) { clearInterval(_sessionCheckTimer); _sessionCheckTimer = null; }
  if (_syncChannel && _syncClient) { _syncClient.removeChannel(_syncChannel); _syncChannel = null; }
  DB.currentUser = null;
  saveDB();
  alert(msg || '会话已过期，请重新登录');
  location.reload();
}

function showRegisterForm() {
  document.getElementById('register-modal').style.display = 'flex';
  document.getElementById('reg-name').value = '';
  document.getElementById('reg-pwd').value = '';
  document.getElementById('reg-error').style.display = 'none';
  setTimeout(function() { document.getElementById('reg-name').focus(); }, 100);
}

function closeRegisterForm() {
  document.getElementById('register-modal').style.display = 'none';
}

function submitRegister() {
  var name = (document.getElementById('reg-name').value || '').trim();
  var pwd = (document.getElementById('reg-pwd').value || '').trim();
  var role = document.getElementById('reg-role').value;
  var errEl = document.getElementById('reg-error');
  if (!name) { if (errEl) { errEl.textContent = '请输入姓名'; errEl.style.display = 'block'; } return; }
  if (name.length < 2) { if (errEl) { errEl.textContent = '姓名至少2个字符'; errEl.style.display = 'block'; } return; }
  if (!pwd || pwd.length < 4) { if (errEl) { errEl.textContent = '密码至少4位'; errEl.style.display = 'block'; } return; }
  if (DEMO_ACCOUNTS[name]) { if (errEl) { errEl.textContent = '该姓名已注册，请直接登录'; errEl.style.display = 'block'; } return; }
  if (!DB.pendingUsers) DB.pendingUsers = [];
  var alreadyPending = DB.pendingUsers.find(function(p) { return p.name === name; });
  if (alreadyPending) { if (errEl) { errEl.textContent = '您已提交过申请，请等待经理审批'; errEl.style.display = 'block'; } return; }
  DB.pendingUsers.push({ name: name, role: role, pwd: pwd, appliedAt: new Date().toISOString().slice(0, 10) });
  saveDB();
  closeRegisterForm();
  toast('申请已提交，请等待经理审批', 'success');
}

function doLogout() {
  confirmDlg('退出登录', '确定退出当前账号吗？', function() {
    if (_sessionCheckTimer) { clearInterval(_sessionCheckTimer); _sessionCheckTimer = null; }
    var _logoutName = DB.currentUser ? DB.currentUser.name : null;
    if (DB.currentUser && DB.sessions) { delete DB.sessions[DB.currentUser.name]; }
    DB.currentUser = null;
    if (SYNC_ENABLED && _logoutName) deleteRemoteSession(_logoutName);
    saveDB();
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    document.getElementById('detail-page').classList.remove('active');
    document.getElementById('form-page').classList.remove('active');
    document.getElementById('topbar').classList.add('hidden');
    document.getElementById('bottom-nav').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-name').value = '';
  });
}

// ============================================================
// 15. INIT
// ============================================================
function init() {
  loadDB();
  initSync(function() {
    initApp();
  });
}

function initApp() {
  var autoName = (function() {
    var m = location.search.match(/[?&]u=([^&]+)/);
    var raw = m ? decodeURIComponent(m[1]) : '';
    return raw.replace(/[<>"'&\\\/]/g, '').slice(0, 50);
  })();
  if (autoName) {
    var account = DEMO_ACCOUNTS[autoName];
    var nameEl = document.getElementById('login-name');
    if (nameEl) nameEl.value = autoName;
    if (account) {
      document.querySelectorAll('.role-btn').forEach(function(b) { b.classList.remove('active'); });
      var targetBtn = document.querySelector('.role-btn[data-role="' + account.role + '"]');
      if (targetBtn) targetBtn.classList.add('active');
    }
    setTimeout(function() {
      var pwdEl = document.getElementById('login-pwd');
      if (pwdEl) { pwdEl.focus(); pwdEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }, 200);
    if (!DEMO_ACCOUNTS[autoName]) toast('未识别账号「' + autoName + '」，请确认链接是否正确', 'error');
  }

  if (DB.currentUser) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');
    refreshNavForRole();
    showTab('workbench');
  }

  // Event listeners
  document.querySelectorAll('.role-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.role-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });

  document.getElementById('login-btn').onclick = function() {
    var name = (document.getElementById('login-name').value || '').trim();
    var role = document.querySelector('.role-btn.active').dataset.role;
    doLogin(name, role);
  };

  document.getElementById('login-name').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var name = e.target.value;
      var role = document.querySelector('.role-btn.active').dataset.role;
      doLogin(name, role);
    }
  });

  document.getElementById('register-link').onclick = showRegisterForm;
  document.getElementById('reg-submit-btn').onclick = submitRegister;
  document.getElementById('reg-cancel-btn').onclick = closeRegisterForm;
  document.getElementById('reg-pwd').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitRegister();
  });

  document.querySelectorAll('.nav-item').forEach(function(item) {
    item.addEventListener('click', function() { navigateTo(item.dataset.page); });
  });

  document.getElementById('fab-add').onclick = function() { openForm(); };
  document.getElementById('fab-add2').onclick = function() { openForm(); };
  document.getElementById('batch-toggle-btn').onclick = toggleBatchMode;
  document.getElementById('batch-level').onclick = batchChangeLevel;
  document.getElementById('batch-consultant').onclick = batchAssignConsultant;
  document.getElementById('batch-pool-btn').onclick = batchMoveToPool;
  document.getElementById('batch-delete-btn').onclick = batchDelete;
  document.getElementById('batch-cancel-btn').onclick = toggleBatchMode;
  document.getElementById('wb-view-list').onclick = function() {
    workbenchView = 'list'; calendarSelectedDate = '';
    document.getElementById('wb-view-list').classList.add('active');
    document.getElementById('wb-view-cal').classList.remove('active');
    renderWorkbench();
  };
  document.getElementById('wb-view-cal').onclick = function() {
    workbenchView = 'calendar';
    document.getElementById('wb-view-cal').classList.add('active');
    document.getElementById('wb-view-list').classList.remove('active');
    var now = new Date();
    calendarYear = now.getFullYear(); calendarMonth = now.getMonth() + 1;
    renderWorkbench();
  };
  document.getElementById('logout-btn').onclick = doLogout;
  var msgBell = document.getElementById('msg-bell-btn');
  if (msgBell) msgBell.onclick = function() { openMsgInboxOverlay(); };
  document.getElementById('detail-back').onclick = closeDetail;
  document.getElementById('form-back').onclick = closeForm;
  document.getElementById('search-input').addEventListener('input', renderCustomerList);
  document.getElementById('level-filter').addEventListener('change', renderCustomerList);
  document.getElementById('sort-select').addEventListener('change', function() {
    currentSort = this.value;
    renderCustomerList();
  });
  document.getElementById('adv-filter-btn').onclick = toggleAdvFilter;
  document.getElementById('filter-channel').addEventListener('change', updateAdvFilter);
  document.getElementById('filter-date-from').addEventListener('change', updateAdvFilter);
  document.getElementById('filter-date-to').addEventListener('change', updateAdvFilter);
  document.getElementById('filter-building').addEventListener('input', function() { filterBuilding = this.value.trim(); renderCustomerList(); });
  document.getElementById('filter-clear').onclick = clearAdvFilter;

  var tabMine = document.getElementById('tab-mine');
  var tabPool = document.getElementById('tab-pool');
  if (tabMine) tabMine.onclick = function() { switchCustTab('mine'); };
  if (tabPool) tabPool.onclick = function() { switchCustTab('pool'); };

  // Pull to refresh
  var custScroll = document.getElementById('cust-scroll');
  var touchStartY = 0;
  custScroll.addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; }, { passive: true });
  custScroll.addEventListener('touchend', function(e) {
    var delta = e.changedTouches[0].clientY - touchStartY;
    if (delta > 60 && custScroll.scrollTop < 20) {
      renderCustomerList();
      toast('已刷新', 'info');
    }
  }, { passive: true });
}

document.addEventListener('DOMContentLoaded', init);
</script>
