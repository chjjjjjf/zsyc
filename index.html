var BUILDING_DATA = {
  '1栋': { '2301': { area: 191.77, type: '01' } },
  '2栋': { '2302': { area: 191.77, type: '02' } },
  '3栋': { '2301': { area: 191.77, type: '01' } },
  '4栋': { '2301': { area: 191.77, type: '01' } },
  '5栋': { '2301': { area: 232.30, type: '01' }, '2302': { area: 232.30, type: '02' } },
  '6栋': {}
};
(function() {
  for (var f = 2; f <= 22; f++) {
    var r = f < 10 ? '0' + f : '' + f;
    BUILDING_DATA['6栋'][r + '01'] = { area: 178.82, type: '01' };
    BUILDING_DATA['6栋'][r + '02'] = { area: 178.82, type: '02' };
  }
})();

function isUnitSold(building, unit) {
  if (!DB.soldUnits) DB.soldUnits = {};
  return !!DB.soldUnits[building + '-' + unit];
}
function markUnitSold(building, unit, customerId) {
  if (!DB.soldUnits) DB.soldUnits = {};
  DB.soldUnits[building + '-' + unit] = { soldAt: today(), soldTo: customerId };
  saveDB();
}
function markUnitAvailable(building, unit) {
  if (!DB.soldUnits) DB.soldUnits = {};
  delete DB.soldUnits[building + '-' + unit];
  saveDB();
}

var _pcCurrentId = null;
var _pcOnSave = null;
var _pcSelectedBuilding = null;
var _pcSelectedUnit = null;

function openPriceCalc(customerId, onSave) {
  if (!customerId) { toast('请先保存客户', 'error'); return; }
  _pcCurrentId = customerId;
  _pcOnSave = onSave || null;
  var c = DB.customers.find(function(x) { return x.id === customerId; });
  if (!c) return;
  var ex = c.calculatedPrice || {};
  _pcSelectedBuilding = ex.building || null;
  _pcSelectedUnit = ex.unit || null;
  renderPriceCalc(c, ex);
}

function renderPriceCalc(c, ex) {
  var bldNames = ['1栋','2栋','3栋','4栋','5栋','6栋'];
  var bldHtml = bldNames.map(function(bld) {
    var units = BUILDING_DATA[bld];
    var unitKeys = Object.keys(units);
    var allSold = unitKeys.length > 0 && unitKeys.every(function(u) { return isUnitSold(bld, u); });
    var isSel = _pcSelectedBuilding === bld;
    var bg = allSold ? '#e8e8e8' : (isSel ? 'rgba(201,169,98,0.2)' : '#fff');
    var border = allSold ? '#ddd' : (isSel ? 'var(--gold)' : '#e5e5e5');
    var color = allSold ? '#bbb' : (isSel ? 'var(--gold)' : '#333');
    var cursor = allSold ? 'default' : 'pointer';
    return '<div onclick="' + (allSold ? 'return' : 'selectBuilding(\'' + bld + '\',\'' + c.id + '\')') + '" style="cursor:' + cursor + ';padding:10px 14px;background:' + bg + ';border:2px solid ' + border + ';border-radius:10px;text-align:center;font-size:14px;font-weight:600;color:' + color + ';transition:all 0.15s;">' + bld + (allSold ? ' (售罄)' : '') + '</div>';
  }).join('');

  var unitHtml = '';
  if (_pcSelectedBuilding) {
    var bldUnits = BUILDING_DATA[_pcSelectedBuilding];
    var ukeys = Object.keys(bldUnits);
    var col01 = ukeys.filter(function(u) { return bldUnits[u].type === '01'; });
    var col02 = ukeys.filter(function(u) { return bldUnits[u].type === '02'; });
    var renderUnitCol = function(units, label) {
      var h = '<div style="flex:1;min-width:0;"><div style="font-size:11px;color:var(--text-dim);font-weight:600;margin-bottom:6px;text-align:center;">' + label + '</div>';
      if (units.length === 0) { h += '<div style="color:#ccc;text-align:center;font-size:12px;">无</div>'; }
      else {
        units.forEach(function(u) {
          var sold = isUnitSold(_pcSelectedBuilding, u);
          var isSel = _pcSelectedUnit === u;
          var bg = sold ? '#e8e8e8' : (isSel ? 'rgba(201,169,98,0.2)' : '#fff');
          var border = sold ? '#ddd' : (isSel ? 'var(--gold)' : '#e5e5e5');
          var color = sold ? '#bbb' : (isSel ? 'var(--gold)' : '#333');
          var cursor = sold ? 'default' : 'pointer';
          h += '<div onclick="' + (sold ? 'return' : 'selectUnit(\'' + u + '\',\'' + c.id + '\')') + '" style="cursor:' + cursor + ';padding:8px 10px;margin-bottom:4px;background:' + bg + ';border:1.5px solid ' + border + ';border-radius:8px;text-align:center;font-size:13px;font-weight:600;color:' + color + ';transition:all 0.15s;">' + u + '<div style="font-size:10px;font-weight:400;color:' + (sold ? '#ccc' : 'var(--text-dim)') + ';">' + bldUnits[u].area + '㎡</div></div>';
        });
      }
      h += '</div>';
      return h;
    };
    unitHtml = '<div style="display:flex;gap:10px;margin-bottom:12px;">' + renderUnitCol(col01, '01户型') + renderUnitCol(col02, '02户型') + '</div>';
  }

  var selInfo = '';
  if (_pcSelectedBuilding && _pcSelectedUnit) {
    var uArea = BUILDING_DATA[_pcSelectedBuilding][_pcSelectedUnit].area;
    selInfo = '<div style="background:rgba(201,169,98,0.1);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;">已选：<b style="color:var(--gold);">' + _pcSelectedBuilding + ' ' + _pcSelectedUnit + '</b>　面积：<b>' + uArea + '㎡</b></div>';
  }

  var unitPriceHtml = '';
  if (ex.price && ex.area) {
    unitPriceHtml = '<div style="margin-bottom:12px;"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:4px;">单价</label><div style="font-size:16px;font-weight:700;color:var(--gold);">' + (Math.round(ex.price / ex.area * 10) / 10).toFixed(1) + ' 万元/㎡</div></div>';
  }

  var html = '<div style="position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);padding:16px;" onclick="if(event.target===this)closePriceCalc()">' +
    '<div style="background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;">' +
      '<div style="padding:16px 20px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1;">' +
        '<span style="font-weight:700;font-size:16px;">💰 算价格</span>' +
        '<span onclick="closePriceCalc()" style="font-size:22px;cursor:pointer;line-height:1;">×</span>' +
      '</div>' +
      '<div style="padding:16px 20px;">' +
        '<div style="font-size:13px;color:var(--text-dim);margin-bottom:14px;">客户：<b style="color:#1a1a1a;">' + escRaw(c.name) + '</b>' + (c.area ? '　意向：<b style="color:#1a1a1a;">' + escHtml(c.area) + '㎡</b>' : '') + '</div>' +
        '<div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:8px;">① 选择楼栋</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;">' + bldHtml + '</div>' +
        (_pcSelectedBuilding ? '<div style="font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:8px;">② 选择户型</div>' + unitHtml : '') +
        selInfo +

  var price = parseFloat((document.getElementById('pc-price') || {}).value) || 0;

  var unitPrice = Math.round(price / area * 10) / 10;

    age: (document.getElementById('f-age').value || '').trim(),
    area: (document.getElementById('f-area').value || '').trim(),
    buildingIntent: (document.getElementById('f-building').value || '').trim(),
    residence: (document.getElementById('f-residence').value || '').trim(),
    competitor: (document.getElementById('f-competitor').value || '').trim(),
    visitDuration: (document.getElementById('f-duration').value || '').trim(),
    revisitCount: parseInt(document.getElementById('f-revisit').value) || 0,
    visitTime: (document.getElementById('f-visittime').value || '').trim(),
    salesStage: (document.querySelector('input[name="f-stage"]:checked') || {}).value || '问询',
    secondaryPhone: (document.getElementById('f-phone2').value || '').trim(),
    birthday: '',
    soace: soace,
    note: (document.getElementById('f-note').value || '').trim(),
    followUpDate: (document.getElementById('f-followupdate').value || '').trim(),
    followUpNote: (document.getElementById('f-note2').value || '').trim(),
    dealStatus: (document.querySelector('input[name="f-deal"]:checked') || {}).value || '未成交',
    dealDate: (document.getElementById('f-dealdate').value || '').trim(),
    resistanceTags: analysis.tags.map(function(t) { return t.name; }),
    solutions: analysis.solutions,
    createdAt: editingCustomer ? editingCustomer.createdAt : new Date().toISOString()
  };

  if (DB.currentUser && DB.currentUser.role === '置业顾问') {
    customerData.consultant = DB.currentUser.name;
  }

  if (editingCustomer) {
    var idx = DB.customers.findIndex(function(x) { return x.id === editingCustomer.id; });
    if (idx !== -1) DB.customers[idx] = customerData;
  } else {
    DB.customers.push(customerData);

  var newId = customerData.id;
  saveDB();
  toast(editingCustomer ? '修改已保存' : '客户添加成功', 'success');

function showTimeFiltered(type, period, label) {
  document.getElementById('detail-overlay').style.display = 'none';
  var todayStr = today();
  var allCs = DB.customers.filter(function(c) { return !c.inPool; });

  // Determine date range
  var startDate = '';
  var now = new Date();
  if (period === 'month') {
    startDate = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-01';
  } else if (period === 'week') {
    var dow = now.getDay() || 7;
    var mon = new Date(now);
    mon.setDate(now.getDate() - dow + 1);
    startDate = fDate(mon);
  } else if (period === 'day') {
    startDate = todayStr;
  }

  var filtered;
  if (period === 'all') {
    filtered = allCs;
  } else if (type === 'visit') {
    // Filter by visit time within period
    filtered = allCs.filter(function(c) {
      return c.visitTime && c.visitTime.slice(0,10) >= startDate;
    });
  } else if (type === 'deal') {
    // Filter by deal date within period
    filtered = allCs.filter(function(c) {
      return (c.dealStatus === '签约' || c.dealStatus === '认购') && c.dealDate && c.dealDate >= startDate;
    });
  }

  // Sort by followup date descending
  filtered.sort(function(a, b) {
    var da = a.followUpDate || '0000-00-00';
    var db = b.followUpDate || '0000-00-00';
    return db.localeCompare(da);
  });

  if (filtered.length === 0) { toast('无符合条件的客户', 'info'); return; }
  renderStatListOverlay(filtered, label + '（' + filtered.length + '人）');
}

function showStatList(shown, label) {
  var todayStr = today();
  var myCs = getMyCustomers();
  if (DB.currentUser && DB.currentUser.role === '销售经理') {
    myCs = DB.customers.filter(function(c) { return !c.inPool; });
  }
  var filtered = [];
  if (label === '所有') filtered = myCs;
  else if (label === '逾期') filtered = myCs.filter(function(c) { return c.followUpDate && daysBetween(c.followUpDate, todayStr) > 0; });
  else if (label === '待跟进') filtered = myCs.filter(function(c) { if (!c.followUpDate) return false; var d = daysBetween(c.followUpDate, todayStr); return d >= 0 && d <= 3; });
  else if (label === '正常') filtered = myCs.filter(function(c) { return !c.followUpDate || daysBetween(c.followUpDate, todayStr) <= 0; });
  else if (label === 'A级') filtered = myCs.filter(function(c) { return c.level === 'A'; });
  else if (label === 'B级') filtered = myCs.filter(function(c) { return c.level === 'B'; });
  else if (label === 'C+级') filtered = myCs.filter(function(c) { return c.level === 'C+'; });
  else if (label === 'C级') filtered = myCs.filter(function(c) { return c.level === 'C'; });
  else if (label === 'C-级') filtered = myCs.filter(function(c) { return c.level === 'C-'; });
  else if (label === 'D级') filtered = myCs.filter(function(c) { return c.level === 'D'; });
  else if (label === '本周新增') filtered = myCs.filter(function(c) { return c.createdAt && daysBetween(todayStr, c.createdAt.slice(0, 10)) <= 7; });
  else if (label === 'deal') filtered = myCs.filter(function(c) { return c.dealStatus === '签约' || c.dealStatus === '认购'; });
  else if (label === 'signed') filtered = myCs.filter(function(c) { return c.dealStatus === '签约'; });
  else if (label === 'subs') filtered = myCs.filter(function(c) { return c.dealStatus === '认购'; });
  else if (label === 'nodeal') filtered = myCs.filter(function(c) { return !c.dealStatus || c.dealStatus === '未成交'; });
  else filtered = myCs.filter(function(c) { return c.channel === label; });
  if (filtered.length === 0) { toast('无符合条件的客户', 'info'); return; }
  renderStatListOverlay(filtered, label);
}

  };

  var cardsHtml = '';
  filtered.forEach(function(c) {
    var phoneMask = maskPhone(c.phone || '');
    var isManager = DB.currentUser && DB.currentUser.role === '销售经理';
    var lvlColor = { 'A': '#27AE60', 'B': '#2980B9', 'C+': '#5b8c5a', 'C': '#95A5A6', 'C-': '#8b6914', 'D': '#E67E22' }[c.level] || '#95A5A6';

    // Info row: channel, area, competitor
    var infoParts = [];
    if (c.channel) infoParts.push('<span>📌 ' + escRaw(c.channel) + '</span>');
    if (c.area) infoParts.push('<span>📐 ' + escRaw(c.area) + '㎡</span>');
    if (c.competitor) infoParts.push('<span>⚖ ' + escRaw(c.competitor) + '</span>');
    var infoRow = infoParts.length > 0 ? '<div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;display:flex;flex-wrap:wrap;gap:6px;">' + infoParts.join('') + '</div>' : '';

    // Price tag
    var priceInfo = '';
    if (c.calculatedPrice && c.calculatedPrice.price) {
      priceInfo = '<span style="font-size:12px;color:var(--gold);font-weight:600;">💰 ' + escHtml(c.calculatedPrice.price) + '万' + (c.calculatedPrice.unitPrice != null ? ' · ' + escHtml(c.calculatedPrice.unitPrice) + '万/㎡' : '') + '</span>';
    }

    // Deal tag
    var dealTag = c.dealStatus && c.dealStatus !== '未成交'
      ? '<span style="background:rgba(46,204,113,0.15);color:var(--green);padding:2px 7px;border-radius:6px;font-size:12px;font-weight:600;">' + c.dealStatus + '</span>' : '';

    // Consultant
    var consultantHtml = isManager ? '<span style="font-size:11px;color:var(--gold);font-weight:600;">顾问：' + escRaw(c.consultant) + '</span>' : '';

    // Followup date
    var followupMeta = '';

      var fd = daysBetween(c.followUpDate, today());
      followupMeta = '<span style="font-size:11px;color:' + (fd > 0 ? 'var(--red)' : fd === 0 ? 'var(--yellow)' : 'var(--text-dim)') + ';">跟进：' + escRaw(c.followUpDate) + '</span>';
    }

    var revisitHtml = c.revisitCount ? '<span class="revisit-badge">复访🔥 ' + c.revisitCount + '次</span>' : '';

    cardsHtml += '<div class="customer-card" data-id="' + c.id + '" style="background:#fff;border-left:3px solid ' + lvlColor + ';">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">' +
        '<span class="level-badge ' + c.level + '">' + c.level + '</span>' +
        '<span style="font-size:15px;font-weight:600;color:#1a1a1a;flex:1;">' + escRaw(c.name) + '</span>' +
        revisitHtml +
        '<span style="font-size:12px;color:var(--text-dim);">' + escHtml(phoneMask) + '</span>' +
      '</div>' +
      infoRow +
      '<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">' +
        stageTag(c.salesStage || '问询') + dealTag + priceInfo + consultantHtml +
      '</div>' +
      '<div style="margin-top:4px;font-size:11px;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;">' +
        (c.residence ? '<span>🏠 ' + escRaw(c.residence) + '</span>' : '') +
        followupMeta +
      '</div>' +
    '</div>';
  });

  var html = '<div id="stat-list-overlay" style="position:fixed;inset:0;z-index:200;background:#f5f5f5;display:flex;flex-direction:column;">' +
    '<div style="padding:16px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;">' +
      '<div style="font-size:22px;cursor:pointer;min-width:44px;text-align:center;" onclick="document.getElementById(\'detail-overlay\').style.display=\'none\';">←</div>' +
      '<div style="flex:1;"><div style="font-size:16px;font-weight:700;">' + escHtml(label) + ' · ' + filtered.length + ' 人</div><div style="font-size:11px;color:var(--text-dim);">点击客户卡片查看详情</div></div>' +
    '</div>' +
    '<div style="flex:1;overflow-y:auto;padding:12px 14px;">' + cardsHtml + '</div>' +

  var overlay = document.getElementById('detail-overlay');

  overlay.querySelectorAll('.customer-card[data-id]').forEach(function(card) {

        '<button onclick="copyPwd(\'' + escHtml(acc.pwd) + '\')" style="background:#C9A962;border:none;color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;cursor:pointer;flex-shrink:0;" title="复制密码">📋</button>' +

function togglePwdVis(uid) {
  var el = document.getElementById(uid);
  if (!el) return;
  var names = Object.keys(DEMO_ACCOUNTS).filter(function(k) { return k !== '程华军'; });
  for (var i = 0; i < names.length; i++) {
    var cid = 'cpwd-' + names[i].replace(/[^a-zA-Z0-9一-龥]/g, '');
    if (cid === uid) {
      var acc = DEMO_ACCOUNTS[names[i]];
      if (el.textContent === '●●●●●●') {
        el.textContent = acc.pwd;
        el.style.userSelect = 'text';
      } else {
        el.textContent = '●●●●●●';
        el.style.userSelect = 'none';
      }
      break;
    }
  }
}

function copyPwd(pwd) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(pwd).then(function() { toast('密码已复制', 'success'); });
  } else { fallbackCopy(pwd); }
}

function addConsultant() {
  var nameEl = document.getElementById('new-consultant-name');
  var pwdEl = document.getElementById('new-consultant-pwd');
  var name = (nameEl || { value: '' }).value.trim();
  var pwd = (pwdEl || { value: '' }).value.trim();
  if (!name) { toast('请输入姓名', 'error'); return; }
  if (DEMO_ACCOUNTS[name]) { toast('「' + name + '」已存在', 'error'); return; }
  if (!pwd) pwd = genPwd();
  DEMO_ACCOUNTS[name] = { role: '置业顾问', pwd: pwd };
  saveDB();
  toast('已添加「' + name + '」密码: ' + pwd, 'success');
  if (nameEl) nameEl.value = '';
  if (pwdEl) pwdEl.value = '';
  renderConsultantList();

function removeConsultant(name) {
  if (!confirm('确认删除顾问「' + name + '」？该操作不可撤销。')) return;
  delete DEMO_ACCOUNTS[name];
  saveDB();
  toast('已删除「' + name + '」', 'success');
  renderConsultantList();
}

function approveUser(idx) {
  var p = (DB.pendingUsers || [])[idx];
  if (!p) return;
  if (!DB.approvedUsers) DB.approvedUsers = [];
  DB.approvedUsers.push({ name: p.name, role: p.role, approvedAt: new Date().toISOString().slice(0, 10), approvedBy: '程华军' });
  // Add to accounts with the password they submitted
  if (!DEMO_ACCOUNTS[p.name]) {
    DEMO_ACCOUNTS[p.name] = { role: p.role || '置业顾问', pwd: p.pwd || genPwd() };
  }
  DB.pendingUsers.splice(idx, 1);
  saveDB();
  toast('已批准 ' + p.name + '，密码：' + (p.pwd || '已自动生成'), 'success');
  showAdminPanel();
}

function rejectUser(idx) {
  var p = (DB.pendingUsers || [])[idx];
  if (!p) return;
  if (!confirm('确认拒绝 ' + p.name + ' 的申请？')) return;
  DB.pendingUsers.splice(idx, 1);
  saveDB();
  toast('已拒绝', 'success');
  showAdminPanel();
}

function toggleAccount(name) {
  if (DEMO_ACCOUNTS[name]) {
    DEMO_ACCOUNTS[name].disabled = !DEMO_ACCOUNTS[name].disabled;
    saveDB();
    showAdminPanel();
    toast(name + (DEMO_ACCOUNTS[name].disabled ? ' 已禁用' : ' 已启用'), 'success');
  }
}

function exportCustomerSummary() {
  var customers = DB.customers || [];

    var hdrs = ['序号','姓名','年龄','电话','意向面积','意向栋数','等级','销售阶段','成交状态','成交日期','顾问','渠道','居住小区','对比项目','职业','是否算价','SOACE分析','抗性标签','解决方案','跟进日期','跟进方式','跟进记录(最近5条)','复访次数','创建日期','公共池','算价结果'];
    var lvOrd = {A:0,B:1,'C+':2,C:3,'C-':4,D:5};
    var sorted = customers.slice().sort(function(a,b) {
      if ((lvOrd[a.level]||9) !== (lvOrd[b.level]||9)) return (lvOrd[a.level]||9) - (lvOrd[b.level]||9);
      return (b.createdAt||'').localeCompare(a.createdAt||'');
    });
    var aoa = [hdrs];
    sorted.forEach(function(c, i) {
      var fu = (c.followUps||[]).slice(0, 5);
      var fuStr = fu.map(function(f) { return (f.time||'').slice(0,10) + ' ' + f.method + '：' + f.content; }).join(' | ');
      aoa.push([
        i+1, c.name||'', c.age||'', maskPhone(c.phone),
        c.area||'', c.buildingIntent||'', c.level||'',
        c.salesStage||'问询', c.dealStatus||'未成交', c.dealDate||'',
        c.consultant||'', c.channel||'', c.residence||'',
        c.competitor||'', c.job||'', c.calculated?'是':'否',
        (c.soace||'').slice(0,200), (c.resistanceTags||[]).join(', '), (c.solutions||[]).join('; '),
        c.followUpDate||'', fu.length>0?fu[0].method||'':'', fuStr,
        c.revisitCount||0, (c.createdAt||'').slice(0,10),
        c.inPool?'是':'否',
        c.calculatedPrice ? (c.calculatedPrice.building||'') + ' ' + (c.calculatedPrice.price||'') + '万' : ''
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '客户档案');
    XLSX.writeFile(wb, '中山御宸客户档案_' + today + '.xlsx');
    toast('Excel已生成，共' + customers.length + '条记录', 'success');
  }

  if (typeof XLSX !== 'undefined') { doExport(); }
  else {
    window._exportFn = doExport;
    var sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    sc.onload = function() { window._exportFn(); window._exportFn = null; };
    sc.onerror = function() { toast('网络不稳定，请重试', 'error'); };
    document.head.appendChild(sc);
  }
}

// ============================================================
var _loginAttempts = 0;
var _loginLockUntil = 0;

function doLogin(name, role) {
  name = (name || '').trim();
  var pwd = (document.getElementById('login-pwd') || { value: '' }).value;
  var err = document.getElementById('login-error');
  if (err) err.style.display = 'none';
  if (!name) { toast('请输入姓名', 'error'); return; }

  // Rate limiting: max 5 attempts, then 30s lockout
  var now = Date.now();
  if (_loginLockUntil > now) {
    var remain = Math.ceil((_loginLockUntil - now) / 1000);
    if (err) { err.textContent = '登录次数过多，请 ' + remain + ' 秒后重试'; err.style.display = 'block'; }
    return;
  }
  if (_loginAttempts >= 5) {
    _loginLockUntil = now + 30000;
    if (err) { err.textContent = '登录次数过多，请30秒后重试'; err.style.display = 'block'; }
    return;
  }

  function loginFailed(msg) {
    _loginAttempts++;
    if (err) { err.textContent = msg || '登录失败'; err.style.display = 'block'; }
    if (_loginAttempts >= 5) {
      _loginLockUntil = Date.now() + 30000;
      if (err) { err.textContent = '登录次数过多，请30秒后重试'; err.style.display = 'block'; }
    }
  }

  // Sales manager login: manager IS admin, has all powers
  if (name === '程华军' && role === '销售经理') {
    var acc = DEMO_ACCOUNTS['程华军'];
    if (!acc || acc.pwd !== pwd) {
      loginFailed('密码错误');
      return;
    }
    _loginAttempts = 0;
    var token = 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
    DB.currentUser = { name: '程华军', role: '销售经理', isAdmin: true, sessionToken: token };
    if (!DB.approvedUsers) DB.approvedUsers = [];
    if (!DB.sessions) DB.sessions = {};
    DB.sessions['程华军'] = token;
    saveDB();
    if (SYNC_ENABLED) syncSessions();
    closeLoginScreen();
    refreshNavForRole();
    enterApp();
    startSessionCheck();
    return;
  }

  // Regular account validation
  var account = DEMO_ACCOUNTS[name];
  if (!account) {
    loginFailed('姓名不在白名单内，请联系管理员');
    return;
  }
  if (account.role !== role) {
    loginFailed('角色与账号不匹配');
    return;
  }
  if (account.disabled) { loginFailed('该账号已被管理员禁用'); return; }
  if (account.pwd !== pwd) {
    loginFailed('密码错误');
    return;
  }
  _loginAttempts = 0;
  if (err) err.style.display = 'none';
  var token = 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  DB.currentUser = { name: name, role: role, sessionToken: token };
  if (!DB.approvedUsers) DB.approvedUsers = [];
  if (!DB.sessions) DB.sessions = {};
  DB.sessions[name] = token;
  saveDB();
  if (SYNC_ENABLED) syncSessions();
  closeLoginScreen();
  refreshNavForRole();
  enterApp();
  startSessionCheck();
  toast('欢迎回来，' + name, 'success');
}

function closeLoginScreen() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('bottom-nav').classList.remove('hidden');
}

function refreshNavForRole() {
  var isManager = DB.currentUser && DB.currentUser.role === '销售经理';
  var nav = document.getElementById('nav-analysis');
  if (nav) nav.style.display = isManager ? '' : 'none';
}

function enterApp() { showTab('workbench'); }

var _sessionCheckTimer = null;
function startSessionCheck() {
  if (_sessionCheckTimer) clearInterval(_sessionCheckTimer);
  _sessionCheckTimer = setInterval(function() {
    if (!DB.currentUser) { if (_sessionCheckTimer) clearInterval(_sessionCheckTimer); return; }
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var db = JSON.parse(raw);
      if (!db.sessions) return;
      var curToken = db.sessions[DB.currentUser.name];
      if (curToken && DB.currentUser.sessionToken && curToken !== DB.currentUser.sessionToken) {
        forceLogout('该账号已在其他设备登录，您已被迫下线');
      }
    } catch(e) {}
    if (SYNC_ENABLED) checkRemoteSession();
  }, 3000);
}

function forceLogout(msg) {
  if (_sessionCheckTimer) { clearInterval(_sessionCheckTimer); _sessionCheckTimer = null; }
  if (_syncChannel && _syncClient) { _syncClient.removeChannel(_syncChannel); _syncChannel = null; }
  DB.currentUser = null;
  saveDB();
  alert(msg || '会话已过期，请重新登录');
  location.reload();
}

function showRegisterForm() {
  document.getElementById('register-modal').style.display = 'flex';
  document.getElementById('reg-name').value = '';
  document.getElementById('reg-pwd').value = '';
  document.getElementById('reg-error').style.display = 'none';
  setTimeout(function() { document.getElementById('reg-name').focus(); }, 100);
}

function closeRegisterForm() {
  document.getElementById('register-modal').style.display = 'none';
}

function submitRegister() {
  var name = (document.getElementById('reg-name').value || '').trim();
  var pwd = (document.getElementById('reg-pwd').value || '').trim();
  var role = document.getElementById('reg-role').value;
  var errEl = document.getElementById('reg-error');
  if (!name) { if (errEl) { errEl.textContent = '请输入姓名'; errEl.style.display = 'block'; } return; }
  if (name.length < 2) { if (errEl) { errEl.textContent = '姓名至少2个字符'; errEl.style.display = 'block'; } return; }
  if (!pwd || pwd.length < 4) { if (errEl) { errEl.textContent = '密码至少4位'; errEl.style.display = 'block'; } return; }
  if (DEMO_ACCOUNTS[name]) { if (errEl) { errEl.textContent = '该姓名已注册，请直接登录'; errEl.style.display = 'block'; } return; }
  if (!DB.pendingUsers) DB.pendingUsers = [];
  var alreadyPending = DB.pendingUsers.find(function(p) { return p.name === name; });
  if (alreadyPending) { if (errEl) { errEl.textContent = '您已提交过申请，请等待经理审批'; errEl.style.display = 'block'; } return; }
  DB.pendingUsers.push({ name: name, role: role, pwd: pwd, appliedAt: new Date().toISOString().slice(0, 10) });
  saveDB();
  closeRegisterForm();
  toast('申请已提交，请等待经理审批', 'success');
}

function doLogout() {
  confirmDlg('退出登录', '确定退出当前账号吗？', function() {
    if (_sessionCheckTimer) { clearInterval(_sessionCheckTimer); _sessionCheckTimer = null; }
    var _logoutName = DB.currentUser ? DB.currentUser.name : null;
    if (DB.currentUser && DB.sessions) { delete DB.sessions[DB.currentUser.name]; }
    DB.currentUser = null;
    if (SYNC_ENABLED && _logoutName) deleteRemoteSession(_logoutName);
    saveDB();
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    document.getElementById('detail-page').classList.remove('active');
    document.getElementById('form-page').classList.remove('active');
    document.getElementById('topbar').classList.add('hidden');
    document.getElementById('bottom-nav').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-name').value = '';
    var nav = document.getElementById('nav-analysis');
    if (nav) nav.style.display = 'none';
  });
}

// ============================================================
// 15. INIT
// ============================================================
function init() {
  loadDB();
  initSync(function() {
    initApp();
  });
}

function initApp() {
  var autoName = (function() {
    var m = location.search.match(/[?&]u=([^&]+)/);
    var raw = m ? decodeURIComponent(m[1]) : '';
    return raw.replace(/[<>"'&\\\/]/g, '').slice(0, 50);
  })();
  if (autoName) {
    var account = DEMO_ACCOUNTS[autoName];
    var nameEl = document.getElementById('login-name');
    if (nameEl) nameEl.value = autoName;
    if (account) {
      document.querySelectorAll('.role-btn').forEach(function(b) { b.classList.remove('active'); });
      var targetBtn = document.querySelector('.role-btn[data-role="' + account.role + '"]');
      if (targetBtn) targetBtn.classList.add('active');
    }
    setTimeout(function() {
      var pwdEl = document.getElementById('login-pwd');
      if (pwdEl) { pwdEl.focus(); pwdEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }, 200);
    if (!DEMO_ACCOUNTS[autoName]) toast('未识别账号「' + autoName + '」，请确认链接是否正确', 'error');
  }

  if (DB.currentUser) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');
    refreshNavForRole();
    showTab('workbench');
  }

  // Event listeners
  document.querySelectorAll('.role-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.role-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });

  document.getElementById('login-btn').onclick = function() {
    var name = (document.getElementById('login-name').value || '').trim();
    var role = document.querySelector('.role-btn.active').dataset.role;
    doLogin(name, role);
  };

  document.getElementById('login-name').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var name = e.target.value;
      var role = document.querySelector('.role-btn.active').dataset.role;
      doLogin(name, role);
    }
  });

  document.getElementById('register-link').onclick = showRegisterForm;
  document.getElementById('reg-submit-btn').onclick = submitRegister;
  document.getElementById('reg-cancel-btn').onclick = closeRegisterForm;
  document.getElementById('reg-pwd').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitRegister();
  });

  document.querySelectorAll('.nav-item').forEach(function(item) {
    item.addEventListener('click', function() { navigateTo(item.dataset.page); });
  });

  document.getElementById('fab-add').onclick = function() { openForm(); };
  document.getElementById('fab-add2').onclick = function() { openForm(); };
  document.getElementById('logout-btn').onclick = doLogout;
  document.getElementById('detail-back').onclick = closeDetail;
  document.getElementById('form-back').onclick = closeForm;
  document.getElementById('search-input').addEventListener('input', renderCustomerList);
  document.getElementById('level-filter').addEventListener('change', renderCustomerList);

  var tabMine = document.getElementById('tab-mine');
  var tabPool = document.getElementById('tab-pool');
  if (tabMine) tabMine.onclick = function() { switchCustTab('mine'); };
  if (tabPool) tabPool.onclick = function() { switchCustTab('pool'); };

  // Pull to refresh
  var custScroll = document.getElementById('cust-scroll');
  var touchStartY = 0;
  custScroll.addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; }, { passive: true });
  custScroll.addEventListener('touchend', function(e) {
    var delta = e.changedTouches[0].clientY - touchStartY;
    if (delta > 60 && custScroll.scrollTop < 20) {
      renderCustomerList();
      toast('已刷新', 'info');
    }
  }, { passive: true });
}

document.addEventListener('DOMContentLoaded', init);
</script>
