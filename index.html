<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>案场销管</title>
<style>
:root {
  --bg: #ffffff;
  --card: #f8f8f8;
  --card2: #f0f0f0;
  --border: #e5e5e5;
  --gold: #C9A962;
  --gold-dim: rgba(201,169,98,0.18);
  --text: #1a1a1a;
  --text-dim: #666;
  --green: #2ecc71;
  --blue: #3498db;
  --gray: #999;
  --orange: #e67e22;
  --red: #e74c3c;
  --yellow: #f39c12;
  --safe: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: system-ui, -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; }

/* LOGIN */
#login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; z-index: 9999; }
#login-screen.hidden { display: none; }
.login-logo { font-size: 32px; font-weight: 700; color: var(--gold); margin-bottom: 8px; letter-spacing: 4px; }
.login-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 40px; }
.login-form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }
.login-role-group { display: flex; gap: 10px; }
.role-btn { flex: 1; padding: 14px; border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text-dim); font-size: 15px; cursor: pointer; transition: all 0.2s; text-align: center; }
.role-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.login-input { width: 100%; padding: 14px 16px; background: var(--card); border: 2px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s; }
.login-input:focus { border-color: var(--gold); }
.login-submit { padding: 16px; background: var(--gold); color: #111; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.login-submit:active { opacity: 0.8; }

/* TOP BAR */
#topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; }
#topbar-title { font-size: 17px; font-weight: 600; color: var(--text); }
.topbar-btn { width: 36px; height: 36px; background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.topbar-btn:active { background: var(--card); }

/* PAGES */
.page { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.page.active { display: flex; }

/* BOTTOM NAV */
#bottom-nav { display: flex; background: var(--card); border-top: 1px solid var(--border); padding-bottom: var(--safe); flex-shrink: 0; z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 0; border: none; background: none; color: var(--text-dim); font-size: 10px; cursor: pointer; transition: color 0.2s; min-height: 50px; position: relative; }
.nav-item.active { color: var(--gold); }
.nav-item.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; background: var(--gold); border-radius: 0 0 3px 3px; }
.nav-icon { font-size: 22px; line-height: 1; }

/* SCROLL */
.scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 80px; }
.scroll-area::-webkit-scrollbar { width: 0; }

/* STAT CARDS */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-clickable { cursor: pointer; transition: transform 0.1s; }
.stat-clickable:active { transform: scale(0.96); }
.stat-tap { font-size: 10px; color: var(--text-dim); margin-top: 3px; opacity: 0.7; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.stat-card.highlight { border-color: var(--gold); background: var(--gold-dim); }
.stat-num { font-size: 28px; font-weight: 700; color: var(--gold); line-height: 1; }
.stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* SECTION */
.section-title { font-size: 14px; font-weight: 600; color: var(--text-dim); padding: 8px 0 10px; display: flex; align-items: center; justify-content: space-between; }

/* CUSTOMER CARD */
.customer-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s; }
.customer-card:active { border-color: var(--gold); }
.card-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.card-name { font-size: 17px; font-weight: 600; color: var(--text); flex: 1; }
.card-phone { font-size: 14px; color: var(--text-dim); }
.level-badge { display: inline-block; min-width: 26px; height: 24px; border-radius: 6px; text-align: center; line-height: 24px; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; padding: 0 3px; background: #555; }
.level-badge.A { background: #1a7a3f; font-size: 14px; }
.level-badge.B { background: #2469b5; font-size: 14px; }
.level-badge.C\+ { background: #5b8c5a; }
.level-badge.C { background: #555; font-size: 14px; }
.level-badge.C- { background: #8b6914; }
.level-badge.D { background: #c06010; font-size: 14px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tag { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
.tag-overdue { background: rgba(231,76,60,0.2); color: var(--red); }
.tag-following { background: rgba(46,204,113,0.2); color: var(--green); }
.tag-new { background: rgba(201,169,98,0.2); color: var(--gold); }
.tag-due { background: rgba(243,156,18,0.2); color: var(--yellow); }
.card-meta { font-size: 13px; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
.card-note { font-size: 13px; color: var(--text-dim); background: var(--card2); border-radius: 6px; padding: 6px 8px; margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.revisit-badge { display: inline-flex; align-items: center; gap: 2px; padding: 2px 7px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #ff6b35, #ff3d00); flex-shrink: 0; }

/* SEARCH */
.search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.search-input { flex: 1; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; }
.search-input:focus { border-color: var(--gold); }
.filter-select { padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; outline: none; }

/* TABS */
.cust-tabs { display: flex; background: var(--card2); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
.cust-tab { flex: 1; padding: 8px 0; border: none; background: transparent; color: var(--text-dim); font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; }
.cust-tab.active { background: var(--bg); color: var(--gold); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

/* FUNNEL */
.funnel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.funnel-title { font-size: 13px; font-weight: 700; color: var(--gold); margin-bottom: 10px; }
.funnel-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.funnel-label { width: 56px; flex-shrink: 0; color: var(--text); font-weight: 600; }
.funnel-bar-wrap { flex: 1; height: 18px; background: var(--card2); border-radius: 4px; overflow: hidden; position: relative; }
.funnel-bar { height: 100%; border-radius: 4px; transition: width 0.3s; }
.funnel-num { width: 36px; text-align: right; color: var(--text-dim); font-size: 11px; }
.funnel-rate { font-size: 10px; color: var(--text-dim); margin-left: 4px; }

/* STAGE BADGES */
.stage-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.stage-问询 { background: rgba(150,150,150,0.15); color: #666; border: 1px solid rgba(150,150,150,0.4); }
.stage-来访 { background: rgba(52,152,219,0.15); color: #2980b9; border: 1px solid rgba(52,152,219,0.4); }
.stage-认筹 { background: rgba(201,169,98,0.15); color: var(--gold); border: 1px solid rgba(201,169,98,0.4); }
.stage-认购 { background: rgba(230,126,34,0.15); color: #d35400; border: 1px solid rgba(230,126,34,0.4); }
.stage-签约 { background: rgba(46,204,113,0.15); color: #1e9e5a; border: 1px solid rgba(46,204,113,0.4); }

/* METHOD TAGS */
.method-tag { display: inline-flex; padding: 1px 6px; border-radius: 8px; font-size: 11px; font-weight: 600; background: var(--card2); color: var(--text-dim); margin-right: 4px; }
.method-来电 { background: rgba(52,152,219,0.12); color: #2980b9; }
.method-来访 { background: rgba(46,204,113,0.12); color: #1e9e5a; }
.method-去电 { background: rgba(230,126,34,0.12); color: #d35400; }
.method-微信 { background: rgba(46,204,113,0.12); color: #07c160; }
.method-短信 { background: rgba(150,150,150,0.15); color: #666; }

/* FOLLOWUP */
.followup-timeline { margin-top: 8px; }
.followup-item { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 12px; }
.followup-item:first-child { border-top: none; }
.followup-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--card2); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.followup-body { flex: 1; min-width: 0; }
.followup-meta { color: var(--text-dim); font-size: 11px; margin-bottom: 4px; }
.followup-content { color: var(--text); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.followup-next { color: var(--gold); font-size: 11px; margin-top: 4px; }

/* QUICK FOLLOWUP */
.quick-followup { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 10px; }
.quick-followup textarea { width: 100%; min-height: 60px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; resize: vertical; font-family: inherit; }
.qf-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.qf-btn { padding: 6px 14px; background: var(--gold); color: #1a1a1a; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
.qf-btn.cancel { background: var(--card); color: var(--text-dim); border: 1px solid var(--border); }

/* SETTINGS */
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.setting-input { width: 60px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); text-align: center; font-size: 13px; font-weight: 700; }

/* HISTORY */
.history-item { display: flex; gap: 8px; padding: 6px 0; font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border); }
.history-item:first-child { border-top: none; }
.history-time { width: 90px; flex-shrink: 0; color: var(--text-dim); }

/* BADGES */
.pool-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: rgba(201,169,98,0.15); color: var(--gold); border: 1px solid rgba(201,169,98,0.4); }
.deal-signed { background: rgba(46,204,113,0.15); color: #1e9e5a; border: 1px solid rgba(46,204,113,0.4); }
.deal-subscribed { background: rgba(230,126,34,0.15); color: #d35400; border: 1px solid rgba(230,126,34,0.4); }

/* TEAM */
.team-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.team-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.team-name { font-size: 15px; font-weight: 700; color: var(--text); }
.team-rate { font-size: 13px; font-weight: 700; }
.team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.team-cell { background: var(--card2); border-radius: 8px; padding: 8px 6px; text-align: center; }
.team-cell .n { font-size: 16px; font-weight: 700; color: var(--text); }
.team-cell .l { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

/* PERF */
.perf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.perf-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px; text-align: center; }
.perf-card .n { font-size: 22px; font-weight: 800; color: var(--gold); }
.perf-card .l { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

/* EMPTY */
.pool-empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state .es-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

/* CHART */
.chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.chart-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 12px; color: var(--text-dim); width: 40px; flex-shrink: 0; }
.bar-track { flex: 1; height: 20px; background: var(--card2); border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s; }
.bar-val { font-size: 12px; color: var(--text-dim); width: 28px; text-align: right; flex-shrink: 0; }

/* PROFILE */
.profile-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 12px; text-align: center; }
.profile-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--gold-dim); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 10px; }
.profile-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.profile-role { font-size: 13px; color: var(--gold); }
.action-list { display: flex; flex-direction: column; gap: 2px; }
.action-item { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: border-color 0.2s; margin-bottom: 8px; font-size: 15px; }
.action-item:active { border-color: var(--gold); }
.action-icon { font-size: 20px; width: 28px; text-align: center; }
.action-text { flex: 1; }
.action-arrow { color: var(--text-dim); font-size: 14px; }
.qr-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 12px; }
.qr-hint { font-size: 12px; color: var(--text-dim); margin-top: 8px; }

/* DETAIL */
.detail-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.back-btn { font-size: 22px; background: none; border: none; color: var(--text); cursor: pointer; padding: 4px; border-radius: 6px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
.back-btn:active { background: var(--card); }
.detail-name { font-size: 18px; font-weight: 700; flex: 1; }
.detail-actions { display: flex; gap: 8px; }
.detail-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; transition: border-color 0.2s; }
.detail-btn:active { border-color: var(--gold); }
.detail-btn.danger { color: var(--red); border-color: rgba(231,76,60,0.3); }
.detail-content { flex: 1; overflow-y: auto; padding: 12px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.info-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.info-label { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
.info-value { font-size: 14px; color: var(--text); word-break: break-all; }
.soace-block { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.soace-text { font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
.resistance-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }

/* FORM */
.form-content { flex: 1; overflow-y: auto; }
.form-inner { padding: 12px 12px 100px; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; display: block; }
.form-label .required { color: var(--red); margin-left: 2px; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.2s; font-family: inherit; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-dim); }
.form-input:disabled, .form-select:disabled { opacity: 0.5; cursor: not-allowed; }
.form-textarea { resize: vertical; min-height: 140px; line-height: 1.6; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.input-sfx { position: relative; }
.input-sfx input { padding-right: 36px; }
.input-sfx::after { content: attr(data-s); position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text-dim); pointer-events: none; }
.smart-paste-btn { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: rgba(201,169,98,0.12); border: 1px dashed var(--gold); border-radius: 10px; color: var(--gold); font-size: 14px; cursor: pointer; margin-bottom: 14px; width: 100%; transition: background 0.2s; }
.smart-paste-btn:active { background: rgba(201,169,98,0.22); }
.form-submit { width: 100%; padding: 16px; background: var(--gold); color: #111; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
.form-submit:active { opacity: 0.8; }
.form-delete { width: 100%; padding: 14px; background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); border-radius: 12px; color: var(--red); font-size: 15px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
.form-delete:active { background: rgba(231,76,60,0.2); }

/* RADIO */
.radio-group { display: flex; gap: 8px; }
.radio-option { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text-dim); font-size: 13px; text-align: center; cursor: pointer; transition: all 0.2s; }
.radio-option.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.radio-option input { display: none; }

/* PARSE PREVIEW */
#parse-preview { background: var(--card); border: 1px solid var(--gold); border-radius: 12px; padding: 14px; margin-bottom: 14px; font-size: 13px; display: none; }
#parse-preview.show { display: block; }
.pp-title { font-weight: 600; color: var(--gold); margin-bottom: 10px; }
.pp-row { display: flex; gap: 8px; margin-bottom: 4px; }
.pp-key { color: var(--text-dim); width: 90px; flex-shrink: 0; }
.pp-val { color: var(--text); flex: 1; word-break: break-all; }
.pp-confirm { margin-top: 10px; display: flex; gap: 8px; }
.pp-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; font-weight: 600; }
.pp-btn.ok { background: var(--gold); color: #111; }
.pp-btn.cancel { background: var(--card2); color: var(--text); }

/* TOAST */
#toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 99999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; }
#toast.success { background: #1a6b3a; color: #fff; }
#toast.error { background: #7b1f1f; color: #fff; }
#toast.info { background: var(--card); color: var(--text); border: 1px solid var(--border); }

/* FAB */
.fab { position: fixed; right: 20px; bottom: calc(70px + var(--safe)); width: 54px; height: 54px; border-radius: 50%; background: var(--gold); color: #111; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; transition: opacity 0.2s; }
.fab:active { opacity: 0.8; }

/* CONFIRM */

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) { if (onDone) onDone(); return; }

    _syncClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    SYNC_ENABLED = true;
  } catch(e) { console.warn('[Sync] Client init failed:', e.message); if (onDone) onDone(); return; }

    _syncReady = true;
    subscribeToRemote();
    if (onDone) onDone();
  });
}

function pullRemoteState(callback) {
  if (!_syncClient) { if (callback) callback(); return; }
  _syncClient
    .from('crm_state')
    .select('data, revision, updated_by')
    .eq('id', 1)
    .maybeSingle()
    .then(function(res) {
      if (res.error) { console.warn('[Sync] Pull failed:', res.error.message); scheduleRetry(); if (callback) callback(); return; }
      if (!res.data || !res.data.data) { pushFullState(); if (callback) callback(); return; }
      var remote = res.data;
      if (remote.revision <= _lastSyncedRevision) { if (callback) callback(); return; }
      _applyingRemote = true;
      try { mergeRemoteData(remote.data); _lastSyncedRevision = remote.revision; } finally { _applyingRemote = false; }
      if (callback) callback();
    })
    .catch(function(err) { console.warn('[Sync] Pull error:', err.message); if (callback) callback(); });
}

function mergeRemoteData(remoteData) {
  var localUser = DB.currentUser;
  var localToken = localUser ? localUser.sessionToken : null;
  DB = remoteData;
  if (!DB.customers) DB.customers = [];
  if (!DB.approvedUsers) DB.approvedUsers = [];
  if (!DB.pendingUsers) DB.pendingUsers = [];
  if (!DB.accounts) DB.accounts = {};
  if (!DB.settings) DB.settings = Object.assign({}, DEFAULT_SETTINGS);
  if (!DB.soldUnits) DB.soldUnits = {};
  if (!DB.sessions) DB.sessions = {};
  if (DB.version == null) DB.version = 3.3;
  DB.currentUser = localUser;
  if (localUser && localToken) DB.currentUser.sessionToken = localToken;
  // Restore accounts & admin code from remote
  if (DB.accounts && Object.keys(DB.accounts).length > 0) { Object.assign(DEMO_ACCOUNTS, DB.accounts); }
  if (DB.adminCode) { ADMIN_CODE = DB.adminCode; }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e) {}
  if (localUser) renderAll();
}

function pushFullState() {
  if (!_syncClient || _applyingRemote || !_syncReady) return;
  var payload = JSON.parse(JSON.stringify(DB));
  delete payload.currentUser;
  _syncClient
    .from('crm_state')
    .upsert({ id: 1, data: payload, updated_by: (DB.currentUser ? DB.currentUser.name + '/' : '') + _syncDeviceId, updated_at: new Date().toISOString(), revision: _lastSyncedRevision + 1 }, { onConflict: 'id' })
    .then(function(res) {
      if (res.error) { console.warn('[Sync] Push failed:', res.error.message); return; }
    })
    .catch(function(err) { console.warn('[Sync] Push error:', err.message); });
}

function syncToRemote() {
  if (!SYNC_ENABLED || !_syncClient || _applyingRemote || !_syncReady) return;
  var now = Date.now();
  if (now - _lastWriteTime < SYNC_DEBOUNCE_MS) {
    if (_writeTimer) clearTimeout(_writeTimer);
    _writeTimer = setTimeout(function() { _lastWriteTime = Date.now(); pushFullState(); }, SYNC_DEBOUNCE_MS);
    return;
  }
  _lastWriteTime = now;
  pushFullState();
}

function subscribeToRemote() {
  if (!_syncClient) return;
  if (_syncChannel) { _syncClient.removeChannel(_syncChannel); _syncChannel = null; }
  _syncChannel = _syncClient
    .channel('crm-state-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'crm_state', filter: 'id=eq.1' }, function(payload) { handleRemoteChange(payload); })
    .subscribe(function(status) {
      if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
        setTimeout(function() { if (_syncClient) subscribeToRemote(); }, 5000);
      }
    });
}

function handleRemoteChange(payload) {
  if (_applyingRemote) return;
  if (!payload || !payload.new || !payload.new.data) return;
  var parts = (payload.new.updated_by || '').split('/');
  var remoteDeviceId = parts[parts.length - 1];
  if (remoteDeviceId === _syncDeviceId) return;
  var remoteRev = payload.new.revision || 0;
  if (remoteRev <= _lastSyncedRevision) return;
  _applyingRemote = true;
  try { mergeRemoteData(payload.new.data); _lastSyncedRevision = remoteRev; } finally { _applyingRemote = false; }
}

function syncSessions() {
  if (!_syncClient || !DB.currentUser) return;
  _syncClient
    .from('crm_sessions')
    .upsert({ team_id: 1, user_name: DB.currentUser.name, session_token: DB.currentUser.sessionToken, created_at: new Date().toISOString() }, { onConflict: 'team_id, user_name' })
    .then(function(res) { if (res.error) console.warn('[Session] Sync failed:', res.error.message); });
}

function checkRemoteSession() {
  if (!_syncClient || !DB.currentUser) return;
  _syncClient
    .from('crm_sessions')
    .select('session_token')
    .eq('team_id', 1)
    .eq('user_name', DB.currentUser.name)
    .maybeSingle()
    .then(function(res) {
      if (res.error || !res.data) return;
      if (res.data.session_token !== DB.currentUser.sessionToken) { forceLogout('该账号已在其他设备登录，您已被迫下线'); }
    });
}

function deleteRemoteSession(name) {
  if (!_syncClient) return;
  _syncClient
    .from('crm_sessions')
    .delete()
    .eq('team_id', 1)
    .eq('user_name', name)
    .then(function(res) { if (res.error) console.warn('[Session] Delete failed:', res.error.message); });
}

function scheduleRetry() {
  if (_syncRetryTimer) return;
  if (_retryCount >= 10) { console.warn('[Sync] Max retries reached'); return; }
  var delay = Math.min(1000 * Math.pow(2, _retryCount), 30000);
  _retryCount++;
  _syncRetryTimer = setTimeout(function() {
    _syncRetryTimer = null;
    pullRemoteState(function() { if (_syncReady) _retryCount = 0; });
    if (_syncReady && !_syncChannel) subscribeToRemote();
  }, delay);
}

// === History & FollowUp Helpers ===
function addHistory(c, action, detail) {
  if (!c.history) c.history = [];
  c.history.unshift({
    time: new Date().toISOString(),
    action: action,
    detail: detail || '',
    operator: DB.currentUser ? DB.currentUser.name : '系统'
  });
}
function addFollowUp(c, method, content, nextDate) {
  if (!c.followUps) c.followUps = [];
  var f = {
    time: new Date().toISOString(),
    method: method || '来访',
    content: content || '',
    nextFollowUp: nextDate || '',
    operator: DB.currentUser ? DB.currentUser.name : '系统'
  };
  c.followUps.unshift(f);
  c.followUpNote = content;
  if (nextDate) c.followUpDate = nextDate;
  addHistory(c, '添加跟进', method + ' · ' + (content || '').slice(0, 20));
}
function autoPoolCheck() {
  if (!DB.settings) DB.settings = Object.assign({}, DEFAULT_SETTINGS);
  var days = DB.settings.autoPoolDays;
  if (!days || days <= 0) return;
  var todayStr = today();
  var moved = [];
  DB.customers.forEach(function(c) {
    if (c.inPool) return;
    if (!c.followUpDate) return;
    var lastDate = c.followUps && c.followUps[0] ? c.followUps[0].time.slice(0,10) : c.followUpDate;
    var d = daysBetween(todayStr, lastDate);
    if (d > days) {
      c.inPool = true;
      c.poolTime = new Date().toISOString();
      c.poolReason = '超' + d + '天未跟进（阈值' + days + '天）';
      addHistory(c, '自动移入公共池', c.poolReason);
      moved.push(c.name);
    }
  });
  if (moved.length > 0) saveDB();
  return moved;
}

function analyzeSOACE(text) {
  if (!text) return { tags: [], analysis: '', solutions: [] };
  var tags = [], solutions = [], t = text;
  var addTag = function(name, level, icon, sol) {
    if (!tags.find(function(x) { return x.name === name; })) {
      tags.push({ name: name, level: level, icon: icon });
      if (sol) solutions.push(sol);
    }
  };
  if (/超预算|太贵|贵|价格|首付|钱不够|预算不足/.test(t)) addTag('预算不足', '高', '🔴', '【引导分期/组合贷】帮助客户制定分阶段付款计划，降低首付压力，突出性价比和升值潜力');
  if (/太大|面积大|不需要这么大|面积太大/.test(t)) addTag('面积不匹配', '中', '🟡', '【推荐替代户型】根据需求推荐面积适中户型，解释空间灵活性和实际使用率');
  if (/不着急|再看看|等等|不急|不急着|观望/.test(t)) addTag('购买时机不对', '中', '🟡', '【制造紧迫感】告知项目本周特惠仅剩X套，引导当日下定锁定优惠');
  if (/对比|竞品|润珑|绿城|万科|恒大|中海|龙湖/.test(t)) addTag('竞品对比', '中', '🟡', '【差异化卖点】梳理本项目独特优势，做竞品对比表，突出核心价值点');
  if (/等润宸|等二期|等新盘|等开盘|等推出/.test(t)) addTag('等候竞品/新品', '中', '🟡', '【时间成本对比】对比竞品入市时间，本项目已是准现房，等待成本远超实际差价');
  if (/朋友|中介|陪同|老公|老婆|家人/.test(t) && !/中介带访/.test(t)) addTag('决策人非本人', '中', '🟡', '【约见决策人】尝试单独约见实际决策人，提供上门接送服务');
  if (/自访|路过|避雨|打卡|随便看看/.test(t)) addTag('自然流失风险', '低', '🟢', '【快速建立好感】24小时内发送项目资料，保持联系频率，邀约参加暖场活动');
  if (/没名额|没资格|限购|资质|不符合/.test(t)) addTag('购房资格问题', '高', '🔴', '【政策方案】详细了解限购政策，提供落户/社保解决方案');
  if (/户型|朝向|采光|格局|设计/.test(t)) addTag('产品疑虑', '低', '🟢', '【产品讲解】安排深度样板间参观，详细讲解户型设计和材料工艺');
  if (solutions.length === 0) solutions.push('【持续维护】保持定期联系，发送项目最新动态和优惠信息，等待合适时机促成');
  solutions = solutions.slice(0, 3);
  var analysis = '';
  if (tags.length > 0) {
    var lines = tags.map(function(tag) { return '| ' + tag.icon + ' ' + tag.name + ' (' + tag.level + ')'; }).join('\n');
    analysis = '┌─────────────────────────────┐\n' + lines + '\n└─────────────────────────────┘';
  }
  return { tags: tags, analysis: analysis, solutions: solutions };
}

function renderResistanceBox(analysis, solutions) {
  if (!analysis && (!solutions || solutions.length === 0)) return '';
  var html = '<div class="resistance-box">';
  html += '<div style="color:var(--gold);font-weight:600;margin-bottom:10px;">🛡️ 抗性分析</div>';
  if (analysis) html += '<div style="margin-bottom:14px;white-space:pre;font-size:13px;">' + escRaw(analysis) + '</div>';
  html += '<div style="color:var(--gold);font-weight:600;margin-bottom:10px;">💡 解决方案</div>';
  solutions.forEach(function(s, i) {
    html += '<div style="margin-bottom:8px;padding:8px 10px;background:var(--card2);border-radius:8px;line-height:1.5;">' + (i + 1) + '. ' + escRaw(s) + '</div>';
  });
  html += '</div>';
  return html;
}

function parseClipboard(text) {
  var r = {};
  if (!text) return r;
  var m;
  m = text.match(/(?:置业顾问|顾问)[:：]\s*(.+)/); if (m) r.consultant = m[1].trim();
  m = text.match(/(?:客户姓名|客户[:：]|姓名)[:：]\s*(.+)/); if (m) r.name = m[1].trim();
  m = text.match(/(?:电话|手机)[:：]\s*(.+)/); if (m) r.phone = m[1].replace(/[\s\-–]/g, '').trim();
  m = text.match(/(?:接待时间|接待时长|时长)[:：]\s*(\d+)/); if (m) r.visitDuration = m[1];
  if (/是否算价[:：]\s*是/.test(text)) r.calculated = true;
  else if (/是否算价[:：]\s*否/.test(text)) r.calculated = false;
  if (/是否全流程[:：]\s*是/.test(text) || /全流程[:：]\s*是/.test(text)) r.fullProcess = true;
  else if (/是否全流程[:：]\s*否/.test(text) || /全流程[:：]\s*否/.test(text)) r.fullProcess = false;
  m = text.match(/(?:来访渠道|渠道)[:：]\s*(.+)/); if (m) {
    var raw = m[1].trim();
    r.channel = CHAN_MAP[raw] || (CHANNELS.find(function(c) { return raw.indexOf(c) !== -1; })) || raw;
  }
  m = text.match(/(?:客户等级|等级)[:：]\s*(C\+|C-|[A-Da-d])/); if (m) r.level = m[1].toUpperCase();
  m = text.match(/(?:职业)[:：]\s*(.+)/); if (m) r.job = m[1].trim();
  m = text.match(/(?:年龄)[:：]\s*(\d+)/); if (m) r.age = m[1];
  m = text.match(/(?:居住小区|小区)[:：]\s*(.+)/); if (m) r.residence = m[1].trim();
  m = text.match(/(?:对比项目|竞品)[:：]\s*(.+)/); if (m) r.competitor = m[1].trim();
  m = text.match(/(?:意向面积|面积)[:：]\s*(\d+)/); if (m) r.area = m[1];
  return r;
}

function smartPaste() {
  if (!navigator.clipboard || !navigator.clipboard.readText) {
    toast('浏览器不支持剪贴板，请手动粘贴', 'error');
    return;
  }
  navigator.clipboard.readText().then(function(text) {
    var parsed = parseClipboard(text);
    var count = Object.keys(parsed).length;
    if (count === 0) { toast('未识别到有效字段，请检查格式', 'error'); return; }
    showParsePreview(parsed, count);
  }).catch(function() {
    toast('读取剪贴板失败，请检查浏览器权限', 'error');
  });
}

function showParsePreview(parsed, count) {
  var preview = document.getElementById('parse-preview');
  var fields = [
    ['name', '姓名'], ['phone', '电话'], ['consultant', '顾问'], ['channel', '渠道'],
    ['level', '等级'], ['calculated', '算价'], ['fullProcess', '全流程'], ['job', '职业'],
    ['age', '年龄'], ['area', '意向面积'], ['residence', '居住小区'], ['competitor', '对比项目'], ['soace', 'SOACE']
  ];
  var html = '<div class="pp-title">已识别 ' + count + ' 个字段，确认填充？</div>';
  fields.forEach(function(f) {
    var key = f[0], label = f[1];
    if (parsed[key] !== undefined) {
      var val = parsed[key];
      if (key === 'calculated' || key === 'fullProcess') val = val ? '是' : '否';
      html += '<div class="pp-row"><span class="pp-key">' + label + '</span><span class="pp-val">' + escRaw(String(val).slice(0, 100)) + '</span></div>';
    }
  });
  html += '<div class="pp-confirm">';
  html += '<button class="pp-btn ok" id="pp-ok">确认填充</button>';
  html += '<button class="pp-btn cancel" id="pp-cancel">取消</button>';
  html += '</div>';
  preview.innerHTML = html;
  preview.classList.add('show');
  document.getElementById('pp-ok').onclick = function() {
    applyParsed(parsed);
    preview.classList.remove('show');
    toast('已填充 ' + count + ' 个字段', 'success');
  };
  document.getElementById('pp-cancel').onclick = function() { preview.classList.remove('show'); };
}

function applyParsed(parsed) {
  var map = {
    'name': 'f-name', 'phone': 'f-phone', 'consultant': 'f-consultant',
    'channel': 'f-channel', 'level': 'f-level', 'job': 'f-job',
    'age': 'f-age', 'area': 'f-area', 'residence': 'f-residence',
    'competitor': 'f-competitor', 'visitDuration': 'f-duration'
  };
  Object.keys(map).forEach(function(key) {
    if (parsed[key] !== undefined) {
      var el = document.getElementById(map[key]);
      if (el) el.value = parsed[key];
    }
  });
  if (parsed.calculated !== undefined) {
    document.querySelectorAll('[name="f-calc"]').forEach(function(r) {
      r.closest('.radio-option').classList.toggle('active', parsed.calculated && r.value === 'true' || !parsed.calculated && r.value === 'false');
      r.checked = parsed.calculated && r.value === 'true' || !parsed.calculated && r.value === 'false';
    });
  }
  if (parsed.fullProcess !== undefined) {
    document.querySelectorAll('[name="f-fp"]').forEach(function(r) {
      r.closest('.radio-option').classList.toggle('active', parsed.fullProcess && r.value === 'true' || !parsed.fullProcess && r.value === 'false');
      r.checked = parsed.fullProcess && r.value === 'true' || !parsed.fullProcess && r.value === 'false';
    });
  }
  if (parsed.soace) {
    var ta = document.getElementById('f-soace');
    if (ta) ta.value = parsed.soace;
  }
}

function getFollowupStatus(c) {
  if (!c.followUpDate) return { cls: 'tag-following', text: '跟进中' };
  var d = daysBetween(c.followUpDate, today());
  if (d > 0) return { cls: 'tag-overdue', text: '过期' + d + '天' };
  if (d === 0) return { cls: 'tag-new', text: '今天待跟进' };
  if (d >= -3) return { cls: 'tag-due', text: '即将到期' };
  return { cls: 'tag-following', text: Math.abs(d) + '天后' };
}

function renderCustomerCard(c) {
  var status = getFollowupStatus(c);
  var daysNew = daysBetween(today(), c.createdAt ? c.createdAt.slice(0, 10) : today());
  var isNew = daysNew <= 2;
  var isManager = DB.currentUser && DB.currentUser.role === '销售经理';
  var consultantHtml = isManager
    ? '<span style="font-size:10px;color:var(--gold);font-weight:600;">顾问：' + escRaw(c.consultant) + '</span>' : '';

  var statusTag = '';

    statusTag = '<span class="tag" style="background:rgba(201,169,98,0.15);color:var(--gold);font-weight:600;">🏊 公共池</span>';
  } else if (isNew && !status.text.includes('过期')) {
    statusTag = '<span class="tag tag-new">🆕 新登记</span>';
  } else {
    statusTag = '<span class="tag ' + status.cls + '">' + status.text + '</span>';
  }

  // Price info
  var priceInfo = '';
  if (c.calculatedPrice && c.calculatedPrice.price) {
    priceInfo = '<span style="font-size:11px;color:var(--gold);font-weight:600;">💰 ' + escHtml(c.calculatedPrice.price) + '万';
    if (c.calculatedPrice.unitPrice != null) priceInfo += ' · ' + escHtml(c.calculatedPrice.unitPrice) + '万/㎡';

  }

  // Primary info row
  var infoRow = '';

  if (c.area) infoParts.push('📐 ' + escRaw(c.area) + '㎡');
  if (c.competitor) infoParts.push('⚖ ' + escRaw(c.competitor));
  if (infoParts.length > 0) infoRow = '<div style="font-size:13px;color:var(--text-dim);margin-bottom:4px;display:flex;flex-wrap:wrap;gap:8px;">' + infoParts.map(function(p) { return '<span>' + p + '</span>'; }).join('') + '</div>';

  var stageInfo = SALES_STAGES.find(function(s) { return s.key === c.salesStage; }) || SALES_STAGES[0];
  var followupMeta = '';

  }

  return '<div class="customer-card" data-id="' + c.id + '">' +

      revisitHtml +
      '<div class="card-phone">' + escRaw(maskPhone(c.phone)) + '</div>' +
    '</div>' +
    infoRow +
    '<div class="card-tags">' + statusTag +
      '<span class="stage-badge stage-' + c.salesStage + '">' + stageInfo.icon + ' ' + c.salesStage + '</span>' +
      (c.followUps && c.followUps[0] ? '<span class="method-tag method-' + c.followUps[0].method + '">' + c.followUps[0].method + '</span>' : '') +
      priceInfo + consultantHtml +
    '</div>' +
    '<div class="card-meta">' +
      '<span>' + (c.createdAt ? c.createdAt.slice(5, 10) : '') + ' 录入</span>' +
      (c.visitTime ? '<span>' + fDate(c.visitTime) + ' 接待</span>' : '') +
      (c.residence ? '<span>🏠 ' + escRaw(c.residence) + '</span>' : '') +
      followupMeta +
    '</div>' +
  '</div>';
}

  list = list.filter(function(c) {
    var matchL = !levelF || c.level === levelF;
    var matchS = !search || c.name.toLowerCase().indexOf(search) !== -1
      || c.phone.indexOf(search) !== -1
      || (c.note || '').toLowerCase().indexOf(search) !== -1
      || (c.soace || '').toLowerCase().indexOf(search) !== -1;
    return matchL && matchS;
  });
  list.sort(function(a, b) {
    var ad = daysBetween(a.followUpDate || '9999', today());
    var bd = daysBetween(b.followUpDate || '9999', today());
    if (ad !== bd) return bd - ad;
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });
  var container = document.getElementById('customer-list');
  var tabElMine = document.getElementById('tab-mine');
  var tabElPool = document.getElementById('tab-pool');
  if (tabElMine) tabElMine.classList.toggle('active', !isPool);
  if (tabElPool) tabElPool.classList.toggle('active', isPool);
  if (list.length === 0) {
    container.innerHTML = isPool
      ? '<div class="pool-empty">🏊 公共池暂无客户<br><br><span style="font-size:12px;color:var(--text-dim);">不要的客户可移入公共池，其他顾问可领取跟进</span></div>'
      : '<div class="empty-state"><div class="es-icon">👥</div><p>暂无客户记录</p><p style="margin-top:6px;font-size:12px;">点击右下角 + 添加客户</p></div>';
    return;
  }
  container.innerHTML = list.map(renderCustomerCard).join('');
  container.querySelectorAll('.customer-card').forEach(function(card) {
    card.addEventListener('click', function() { openDetail(card.dataset.id); });
  });
}

}

// === Workbench ===

    html += '<div class="workbench-section"><div class="wb-list">';
    overdue.forEach(function(c) {
      var d = daysBetween(c.followUpDate, todayStr);
      var infoExtras = [];
      if (c.channel) infoExtras.push('📌' + escRaw(c.channel));
      if (c.area) infoExtras.push('📐' + escRaw(c.area) + '㎡');
      if (c.competitor) infoExtras.push('⚖' + escRaw(c.competitor));
      var rvHtml = c.revisitCount ? '<span class="revisit-badge" style="font-size:10px;padding:1px 5px;">复访🔥' + c.revisitCount + '</span>' : '';
      html += '<div class="wb-item" data-id="' + c.id + '"><span class="level-badge ' + c.level + '" style="flex-shrink:0">' + c.level + '</span><div style="flex:1;min-width:0;"><div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;"><span>' + escRaw(c.name) + '</span>' + rvHtml + '</div><div style="font-size:12px;color:var(--text-dim);">逾期 ' + d + ' 天 · ' + escRaw(c.followUpNote || c.note || '') + '</div>' + (infoExtras.length > 0 ? '<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">' + infoExtras.join(' ') + '</div>' : '') + '</div><span class="tag tag-overdue">⏸ ' + d + '天</span></div>';

      var rvHtml = c.revisitCount ? '<span class="revisit-badge" style="font-size:10px;padding:1px 5px;">复访🔥' + c.revisitCount + '</span>' : '';
      html += '<div class="wb-item" data-id="' + c.id + '"><span class="level-badge ' + c.level + '" style="flex-shrink:0">' + c.level + '</span><div style="flex:1;min-width:0;"><div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;"><span>' + escRaw(c.name) + '</span>' + rvHtml + '</div><div style="font-size:12px;color:var(--text-dim);">' + escRaw(c.followUpNote || c.note || '') + '</div>' + (infoExtras.length > 0 ? '<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">' + infoExtras.join(' ') + '</div>' : '') + '</div><span class="tag tag-due">🔔 ' + label + '</span></div>';

// === Stats ===
function renderStats() {
  var isManager = DB.currentUser && DB.currentUser.role === '销售经理';
  if (isManager) { renderTeamStats(); } else { renderSelfStats(); }
}

function renderSelfStats() {
  var customers = getMyCustomers();
  var dealCount = customers.filter(function(c) { return c.dealStatus === '签约' || c.dealStatus === '认购'; }).length;
  var signedCount = customers.filter(function(c) { return c.dealStatus === '签约'; }).length;
  var total = customers.length || 1;
  var dealRate = Math.round(dealCount / total * 100);
  var levelCounts = { A: 0, B: 0, 'C+': 0, C: 0, 'C-': 0, D: 0 };
  var channelCounts = {};
  customers.forEach(function(c) {
    if (levelCounts[c.level] !== undefined) levelCounts[c.level]++; else levelCounts[c.level] = 1;
    if (c.channel) channelCounts[c.channel] = (channelCounts[c.channel] || 0) + 1;
  });
  var levelColors = { A: '#2ecc71', B: '#3498db', 'C+': '#5b8c5a', C: '#888', 'C-': '#8b6914', D: '#e67e22' };
  var levelHtml = Object.keys(levelCounts).map(function(lv) {
    var cnt = levelCounts[lv];
    return '<div class="bar-row bar-clickable" style="cursor:pointer;" data-stat-bar="level" data-stat-val="' + lv + '级"><span class="bar-label" style="color:' + levelColors[lv] + '">' + lv + '级</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(cnt / total * 100) + '%;background:' + levelColors[lv] + '"></div></div><span class="bar-val">' + cnt + '人</span></div>';
  }).join('');
  var sortedCh = Object.entries(channelCounts).sort(function(a, b) { return b[1] - a[1]; });
  var channelHtml = sortedCh.map(function(e) {
    return '<div class="bar-row bar-clickable" style="cursor:pointer;" data-stat-bar="channel" data-stat-val="' + escHtml(e[0]) + '"><span class="bar-label">' + escRaw(e[0]) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(e[1] / total * 100) + '%;background:var(--gold)"></div></div><span class="bar-val">' + e[1] + '人</span></div>';
  }).join('');
  var todayStr = today();
  var overdue = customers.filter(function(c) { return c.followUpDate && daysBetween(c.followUpDate, todayStr) > 0; }).length;
  var following = customers.length - overdue;
  var html = '<div class="chart-title" style="padding:14px 16px 4px;">📊 我的业绩</div>' +
    '<div class="perf-grid" id="self-perf-grid">' +
      '<div class="perf-card perf-clickable" style="cursor:pointer;" data-self-stat="all"><div class="n">' + customers.length + '</div><div class="l">来访组数</div><div class="stat-tap">点击查看</div></div>' +
      '<div class="perf-card perf-clickable" style="cursor:pointer;" data-self-stat="deal"><div class="n">' + dealCount + '</div><div class="l">成交(认购+签约)</div><div class="stat-tap">点击查看</div></div>' +
      '<div class="perf-card perf-clickable" style="cursor:pointer;" data-self-stat="all"><div class="n">' + dealRate + '%</div><div class="l">成交率</div><div class="stat-tap">点击查看全部</div></div>' +
    '</div>' +
    '<div class="perf-grid" id="self-perf-grid2">' +
      '<div class="perf-card perf-clickable" style="cursor:pointer;" data-self-stat="signed"><div class="n" style="color:var(--green)">' + signedCount + '</div><div class="l">签约</div><div class="stat-tap">点击查看</div></div>' +
      '<div class="perf-card perf-clickable" style="cursor:pointer;" data-self-stat="subs"><div class="n" style="color:var(--orange)">' + (dealCount - signedCount) + '</div><div class="l">认购</div><div class="stat-tap">点击查看</div></div>' +
      '<div class="perf-card perf-clickable" style="cursor:pointer;" data-self-stat="nodeal"><div class="n" style="color:var(--text)">' + (customers.length - dealCount) + '</div><div class="l">未成交</div><div class="stat-tap">点击查看</div></div>' +
    '</div>' +
    '<div class="chart-box"><div class="chart-title">📊 客户等级分布（共' + total + '人）</div><div class="bar-chart" id="self-level-chart">' + levelHtml + '</div></div>' +
    '<div class="chart-box"><div class="chart-title">📈 来访渠道分布</div>' + (channelHtml ? '<div class="bar-chart" id="self-channel-chart">' + channelHtml + '</div>' : '<div style="color:var(--text-dim);font-size:13px;">暂无数据</div>') + '</div>' +
    '<div class="chart-box"><div class="chart-title">📋 跟进状态概览</div><div class="bar-chart" id="self-followup-chart">' +
      '<div class="bar-row bar-clickable" style="cursor:pointer;" data-stat-bar="overdue"><span class="bar-label" style="color:var(--red)">逾期</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(overdue / total * 100) + '%;background:var(--red)"></div></div><span class="bar-val">' + overdue + '人</span></div>' +
      '<div class="bar-row bar-clickable" style="cursor:pointer;" data-stat-bar="normal"><span class="bar-label" style="color:var(--green)">正常</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(following / total * 100) + '%;background:var(--green)"></div></div><span class="bar-val">' + following + '人</span></div>' +
    '</div></div>';
  document.getElementById('stats-scroll').innerHTML = html;

  // Event delegation for self perf cards
  document.getElementById('stats-scroll').querySelectorAll('.perf-clickable').forEach(function(card) {
    card.addEventListener('click', function() {
      var s = card.dataset.selfStat;
      if (s === 'all') showStatList(99, '所有');
      else if (s === 'deal') showStatList(99, 'deal');
      else if (s === 'signed') showStatList(99, 'signed');
      else if (s === 'subs') showStatList(99, 'subs');
      else if (s === 'nodeal') showStatList(99, 'nodeal');
    });
  });

  // Event delegation for bar clicks
  document.getElementById('stats-scroll').querySelectorAll('.bar-clickable').forEach(function(bar) {
    bar.addEventListener('click', function() {
      var barType = bar.dataset.statBar;
      var barVal = bar.dataset.statVal;
      if (barType === 'level' || barType === 'channel') showStatList(99, barVal || '');
      else if (barType === 'overdue') showStatList(99, '逾期');
      else if (barType === 'normal') showStatList(99, 'normal');
    });
  });
}

function renderTeamStats() {
  var all = getAllAssignedCustomers();
  var pool = getPoolCustomers();
  var todayStr = today();
  var totalDeal = all.filter(function(c) { return c.dealStatus === '签约' || c.dealStatus === '认购'; }).length;
  var totalRate = all.length ? Math.round(totalDeal / all.length * 100) : 0;

  var groups = {};
  all.forEach(function(c) {
    var name = c.consultant || '未分配';
    if (!groups[name]) groups[name] = [];
    groups[name].push(c);
  });

  var teamHtml = Object.keys(groups).map(function(name) {
    var list = groups[name];
    var deal = list.filter(function(c) { return c.dealStatus === '签约' || c.dealStatus === '认购'; }).length;
    var signed = list.filter(function(c) { return c.dealStatus === '签约'; }).length;
    var rate = Math.round(deal / list.length * 100);
    var counts = { A: 0, B: 0, 'C+': 0, C: 0, 'C-': 0, D: 0 };
    list.forEach(function(c) { if (counts[c.level] !== undefined) counts[c.level]++; else counts[c.level] = 1; });
    var overdueN = list.filter(function(c) { return c.followUpDate && daysBetween(c.followUpDate, todayStr) > 0; }).length;
    var rateColor = rate >= 30 ? 'var(--green)' : (rate >= 15 ? 'var(--gold)' : 'var(--text-dim)');
    return '<div class="team-card" style="cursor:pointer;">' +
      '<div class="team-card-head">' +
        '<span class="team-name"> ' + escRaw(name) + '</span>' +
        '<span class="team-rate" style="color:' + rateColor + '">成交率 ' + rate + '%</span>' +
      '</div>' +
      '<div class="team-grid">' +
        '<div class="team-cell"><div class="n">' + list.length + '</div><div class="l">来访组数</div></div>' +
        '<div class="team-cell"><div class="n" style="color:var(--gold)">' + deal + '</div><div class="l">成交数</div></div>' +
        '<div class="team-cell"><div class="n" style="color:var(--red)">' + overdueN + '</div><div class="l">逾期跟进</div></div>' +
        '<div class="team-cell"><div class="n" style="color:#2ecc71">' + counts.A + '</div><div class="l">A级</div></div>' +
        '<div class="team-cell"><div class="n" style="color:#3498db">' + counts.B + '</div><div class="l">B级</div></div>' +
        '<div class="team-cell"><div class="n" style="color:#5b8c5a">' + counts['C+'] + '</div><div class="l">C+级</div></div>' +
        '<div class="team-cell"><div class="n" style="color:#555">' + counts.C + '</div><div class="l">C级</div></div>' +
        '<div class="team-cell"><div class="n" style="color:#8b6914">' + counts['C-'] + '</div><div class="l">C-级</div></div>' +
        '<div class="team-cell"><div class="n" style="color:#e67e22">' + counts.D + '</div><div class="l">D级</div></div>' +
      '</div>' +
      '<div style="margin-top:8px;font-size:11px;color:var(--text-dim);">签约 ' + signed + ' · 认购 ' + (deal - signed) + ' · 未成交 ' + (list.length - deal) + '</div>' +
    '</div>';
  }).join('');

  var poolHtml = pool.length > 0
    ? '<div class="chart-box"><div class="chart-title">🏊 公共池（' + pool.length + '）</div><div style="font-size:12px;color:var(--text-dim);line-height:1.8;">' +

// === Analysis (Manager Only) ===
var analysisFilter = { level: 'ALL', consultant: 'ALL', deal: 'ALL', stage: 'ALL', revisit: 'ALL' };
function setAnalysisFilter(type, val) {
  if (type === 'level') analysisFilter.level = val;
  else if (type === 'consultant') analysisFilter.consultant = val;
  else if (type === 'deal') analysisFilter.deal = val;
  else if (type === 'stage') analysisFilter.stage = val;
  else if (type === 'revisit') analysisFilter.revisit = val;
  renderAnalysis();
}

function filterChip(type, val, label, active, color) {
  var c = active ? (color || '#C9A962') : '#e5e5e5';
  var bg = active ? (color || '#C9A962') : '#fff';
  var fg = active ? '#fff' : '#666';
  return '<button onclick="setAnalysisFilter(\'' + type + '\',\'' + val + '\')" style="border:1.5px solid ' + c + ';background:' + bg + ';color:' + fg + ';border-radius:18px;padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap;">' + label + '</button>';
}

function renderAnalysis() {
  var allCustomers = DB.customers;
  var consultantSet = {};
  allCustomers.forEach(function(c) { if (c.consultant) consultantSet[c.consultant] = true; });
  var consultantNames = Object.keys(consultantSet).sort();

  var total = allCustomers.length;
  var signedCount = allCustomers.filter(function(c) { return c.dealStatus === '签约'; }).length;
  var subsCount = allCustomers.filter(function(c) { return c.dealStatus === '认购'; }).length;
  var poolCount = allCustomers.filter(function(c) { return c.inPool; }).length;
  var revisitCount = allCustomers.filter(function(c) { return (c.revisitCount || 0) >= 2; }).length;

  var levelChips = ['ALL', 'A', 'B', 'C+', 'C', 'C-', 'D'].map(function(lv) {
    var col = lv === 'ALL' ? '#C9A962' : { A: '#2ecc71', B: '#3498db', 'C+': '#5b8c5a', C: '#888', 'C-': '#8b6914', D: '#e67e22' }[lv];
    return filterChip('level', lv, lv === 'ALL' ? '全部' : lv + '级', analysisFilter.level === lv, col);
  }).join('');

  var consultantChips = ['ALL'].concat(consultantNames).map(function(cn) {
    return filterChip('consultant', cn, cn === 'ALL' ? '全部顾问' : cn, analysisFilter.consultant === cn);
  }).join('');

  var dealChips = ['ALL', '认购', '签约', '未成交'].map(function(d) {
    var col = d === '认购' ? '#e67e22' : d === '签约' ? '#2ecc71' : d === '未成交' ? '#888' : '#C9A962';
    return filterChip('deal', d, d === 'ALL' ? '全部成交' : d, analysisFilter.deal === d, col);
  }).join('');

  var stageChips = ['ALL'].concat(SALES_STAGES.map(function(s) { return s.key; })).map(function(k) {
    var st = SALES_STAGES.find(function(s) { return s.key === k; });
    var col = k === 'ALL' ? '#C9A962' : st.color;
    var label = k === 'ALL' ? '全部阶段' : (st ? st.icon + ' ' + st.label : k);
    return filterChip('stage', k, label, analysisFilter.stage === k, col);
  }).join('');

  var revisitChips = filterChip('revisit', 'ALL', '全部', analysisFilter.revisit === 'ALL')
    + filterChip('revisit', 'ONLY', '仅复访 (' + revisitCount + ')', analysisFilter.revisit === 'ONLY', '#C9A962');

  var customers = allCustomers.filter(function(c) {
    if (analysisFilter.level !== 'ALL' && c.level !== analysisFilter.level) return false;
    if (analysisFilter.consultant !== 'ALL' && c.consultant !== analysisFilter.consultant) return false;
    if (analysisFilter.deal !== 'ALL' && (c.dealStatus || '未成交') !== analysisFilter.deal) return false;
    if (analysisFilter.stage !== 'ALL' && (c.salesStage || '问询') !== analysisFilter.stage) return false;
    if (analysisFilter.revisit === 'ONLY' && (c.revisitCount || 0) < 2) return false;
    return true;
  });
  customers.sort(function(a, b) {
    var order = { A: 0, B: 1, C: 2, D: 3 };
    var la = order[a.level] || 4, lb = order[b.level] || 4;
    if (la !== lb) return la - lb;
    if (a.dealStatus === '签约' && b.dealStatus !== '签约') return -1;
    if (b.dealStatus === '签约' && a.dealStatus !== '签约') return 1;
    if (a.dealStatus === '认购' && b.dealStatus !== '认购') return -1;
    if (b.dealStatus === '认购' && a.dealStatus !== '认购') return 1;
    return 0;
  });

  var filterDesc = [];
  if (analysisFilter.level !== 'ALL') filterDesc.push(analysisFilter.level + '级');
  if (analysisFilter.consultant !== 'ALL') filterDesc.push(analysisFilter.consultant);
  if (analysisFilter.deal !== 'ALL') filterDesc.push(analysisFilter.deal);
  if (analysisFilter.stage !== 'ALL') filterDesc.push(analysisFilter.stage + '阶段');
  if (analysisFilter.revisit === 'ONLY') filterDesc.push('仅复访');
  var filterText = filterDesc.length ? '（' + filterDesc.join(' · ') + '）' : '';

  var showRevisit = analysisFilter.revisit === 'ONLY';
  function renderRevisitBlock(c) {
    var rc = c.revisitCount || 0;
    var fus = (c.followUps || []).slice().reverse().slice(0, 5);
    var items = fus.length > 0
      ? fus.map(function(f) { return '· ' + (f.time ? f.time.slice(0, 10) : '') + ' ' + (f.method || '') + '：' + (f.content || '（无备注）'); }).join('<br>')
      : '暂无跟进记录';
    return '<div style="margin:-4px 12px 10px;padding:8px 10px;background:#fff8ec;border-left:3px solid #ff6b35;border-radius:0 0 6px 6px;font-size:13px;color:#7a5c10;line-height:1.6;">🔥 复访 <strong>' + rc + '</strong> 次　跟进记录：<br>' + items + '</div>';
  }

  var listHtml = customers.length > 0
    ? customers.map(function(c) { return renderCustomerCard(c) + (showRevisit ? renderRevisitBlock(c) : ''); }).join('')
    : '<div class="empty-state"><div class="es-icon">🔍</div><p>无符合条件的客户</p></div>';

  var html =
    '<div style="padding:14px 16px;font-size:16px;font-weight:700;color:var(--gold);">📋 客户梳理表</div>' +
    '<div style="padding:0 16px 8px;font-size:11px;color:var(--text-dim);">点击筛选归类 · 经理专用</div>' +
    '<div class="perf-grid" style="padding:0 16px;">' +
      '<div class="perf-card" style="cursor:pointer;" data-anal="all"><div class="n" style="color:var(--gold)">' + total + '</div><div class="l">全部客户</div><div class="stat-tap">点击查看</div></div>' +
      '<div class="perf-card" style="cursor:pointer;" data-anal="signed"><div class="n" style="color:#2ecc71">' + signedCount + '</div><div class="l">已签约</div><div class="stat-tap">点击查看</div></div>' +
      '<div class="perf-card" style="cursor:pointer;" data-anal="subs"><div class="n" style="color:#f39c12">' + subsCount + '</div><div class="l">已认购</div><div class="stat-tap">点击查看</div></div>' +
      '<div class="perf-card" style="cursor:pointer;" data-anal="revisit"><div class="n" style="color:#C9A962">' + revisitCount + '</div><div class="l">复访</div><div class="stat-tap">点击查看</div></div>' +
    '</div>' +
    '<div style="padding:4px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按等级</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + levelChips + '</div></div>' +
    (consultantNames.length > 1 ? '<div style="padding:12px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按顾问</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + consultantChips + '</div></div>' : '') +
    '<div style="padding:12px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按成交状态</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + dealChips + '</div></div>' +
    '<div style="padding:12px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按销售阶段</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + stageChips + '</div></div>' +
    '<div style="padding:12px 16px 0;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;">按复访</div><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">' + revisitChips + '</div></div>' +
    '<div class="section-title" style="margin-top:16px;padding:0 16px;">📇 客户列表' + filterText + ' · 共 ' + customers.length + ' 位</div>' +
    listHtml;

  document.getElementById('analysis-scroll').innerHTML = html;

  // Event delegation for perf cards
  document.getElementById('analysis-scroll').querySelectorAll('.perf-card[data-anal]').forEach(function(card) {
    card.addEventListener('click', function() {
      var anal = card.dataset.anal;
      if (anal === 'all') { setAnalysisFilter('level', 'ALL'); setAnalysisFilter('consultant', 'ALL'); setAnalysisFilter('deal', 'ALL'); setAnalysisFilter('stage', 'ALL'); setAnalysisFilter('revisit', 'ALL'); renderAnalysis(); }
      else if (anal === 'signed') { setAnalysisFilter('level', 'ALL'); setAnalysisFilter('consultant', 'ALL'); setAnalysisFilter('deal', '签约'); setAnalysisFilter('stage', 'ALL'); setAnalysisFilter('revisit', 'ALL'); renderAnalysis(); }
      else if (anal === 'subs') { setAnalysisFilter('level', 'ALL'); setAnalysisFilter('consultant', 'ALL'); setAnalysisFilter('deal', '认购'); setAnalysisFilter('stage', 'ALL'); setAnalysisFilter('revisit', 'ALL'); renderAnalysis(); }
      else if (anal === 'revisit') { setAnalysisFilter('level', 'ALL'); setAnalysisFilter('consultant', 'ALL'); setAnalysisFilter('deal', 'ALL'); setAnalysisFilter('stage', 'ALL'); setAnalysisFilter('revisit', 'ONLY'); renderAnalysis(); }
    });
  });

  // Event delegation for customer cards
  document.getElementById('analysis-scroll').querySelectorAll('.customer-card').forEach(function(card) {
    card.addEventListener('click', function() { openDetail(card.dataset.id); });
  });
}

function exportData() {
  var dataStr = JSON.stringify(DB, null, 2);
  var blob = new Blob([dataStr], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '中山御宸客户档案_' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出', 'success');
}

function importData() {
  var file = document.getElementById('import-file').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.customers || !Array.isArray(data.customers)) { toast('文件格式不正确', 'error'); return; }
      confirmDlg('导入确认', '将导入 ' + data.customers.length + ' 条客户记录，是否覆盖现有数据？', function() {
        DB.customers = data.customers;
        saveDB();
        toast('成功导入 ' + data.customers.length + ' 条记录', 'success');
        navigateTo('workbench');
      });
    } catch(err) { toast('文件解析失败', 'error'); }
  };
  reader.readAsText(file);
  document.getElementById('import-file').value = '';
}

        '<div class="followup-body">' +

          '<div class="followup-content">' + escRaw(f.content || '') + '</div>' +
          (f.nextFollowUp ? '<div class="followup-next">⏰ 下次：' + escRaw(f.nextFollowUp) + '</div>' : '') +
        '</div>' +
      '</div>';

  followupHtml += '<div class="quick-followup">' +
    '<div style="color:var(--gold);font-weight:600;margin-bottom:8px;font-size:12px;">➕ 快速跟进</div>' +
    '<div class="qf-row" style="margin-bottom:6px;">' +
      FOLLOWUP_METHODS.map(function(m) {
        return '<label class="radio-option" style="padding:4px 10px;font-size:11px;"><input type="radio" name="qf-method" value="' + m + '" hidden>' + m + '</label>';
      }).join('') +
    '</div>' +
    '<textarea id="qf-content" placeholder="本次跟进内容..."></textarea>' +
    '<div class="qf-row">' +
      '<span style="font-size:11px;color:var(--text-dim);">下次跟进</span>' +
      '<input type="date" id="qf-next" class="form-input" style="flex:1;" value="' + fDate(new Date(Date.now() + 7 * 86400000)) + '">' +
      '<button class="qf-btn" id="qf-submit">保存跟进</button>' +
    '</div>' +
  '</div></div>';

  // History
  var historyHtml = '';
  if (c.history && c.history.length > 0) {
    historyHtml = '<div style="margin-top:12px;"><div class="section-title">📜 操作历史（' + c.history.length + '）</div><div class="soace-block">';
    c.history.slice(0, 8).forEach(function(h) {
      var t = h.time ? h.time.slice(0, 16).replace('T', ' ') : '';
      historyHtml += '<div class="history-item">' +
        '<span class="history-time">' + escRaw(t) + '</span>' +
        '<span style="flex:1;"><b style="color:var(--gold);">' + escRaw(h.action) + '</b> · ' + escRaw(h.operator || '') + (h.detail ? ' · ' + escRaw(h.detail) : '') + '</span>' +
      '</div>';
    });
    if (c.history.length > 8) historyHtml += '<div style="text-align:center;padding:6px;color:var(--text-dim);font-size:11px;">还有 ' + (c.history.length - 8) + ' 条...</div>';
    historyHtml += '</div></div>';
  }

  var soaceHtml = c.soace ? '<div class="soace-block"><div style="font-size:12px;color:var(--gold);font-weight:600;margin-bottom:8px;">📋 客户情况 / SOACE</div><div class="soace-text">' + esc(c.soace) + '</div></div>' : '';
  var noteHtml = c.note ? '<div class="soace-block"><div style="font-size:12px;color:var(--text-dim);font-weight:600;margin-bottom:8px;">📝 备注</div><div style="font-size:13px;color:var(--text);white-space:pre-wrap;">' + esc(c.note) + '</div></div>' : '';
  var resistanceHtml = renderResistanceBox(analysis2.analysis, c.solutions || []);

  // Followup status line
  var followupStatusHtml = c.followUpDate
    ? '<div class="info-item" style="grid-column:1/-1;"><div class="info-label">跟进状态</div><div class="info-value"><span class="tag ' + status.cls + '">' + status.text + '</span> · ' + escRaw(c.followUpNote || '无跟进说明') + '</div></div>' : '';

  var priceHtml = c.calculatedPrice
    ? '<div class="info-item" style="background:rgba(201,169,98,0.08);border-left:3px solid var(--gold);"><div class="info-label" style="color:var(--gold);font-size:11px;">💰 算价结果</div><div class="info-value" style="font-size:13px;">' +
        '<div style="margin-bottom:4px;"><b>房源：</b>' + escHtml((c.calculatedPrice.building || '') + ' ' + (c.calculatedPrice.unit || '')) + '　<b>面积：</b>' + escHtml(c.calculatedPrice.area || '') + '㎡</div>' +
        '<div><b>总价：</b><span style="font-size:16px;color:var(--gold);font-weight:700;">' + escHtml(c.calculatedPrice.price || '') + ' 万元</span>　<b>单价：</b><span style="font-size:14px;color:var(--gold);font-weight:700;">' + (c.calculatedPrice.unitPrice != null ? escHtml(c.calculatedPrice.unitPrice) + ' 万元/㎡' : '—') + '</span></div>' +
        '<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">算价日期：' + escHtml(c.calculatedPrice.date || '') + '</div>' +
      '</div></div>' : '';

  document.getElementById('detail-content').innerHTML =
    '<div class="info-grid">' +
      '<div class="info-item"><div class="info-label">客户等级</div><div class="info-value"><span class="level-badge ' + c.level + '" style="display:inline-flex;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;color:#fff;font-size:14px;">' + c.level + '</span> ' + c.level + '级</div></div>' +
      '<div class="info-item"><div class="info-label">来访渠道</div><div class="info-value">' + escRaw(c.channel || '—') + '</div></div>' +
      consHtml +
      '<div class="info-item"><div class="info-label">电话号码</div><div class="info-value">' + escRaw(c.phone) + '</div></div>' +
      '<div class="info-item"><div class="info-label">是否算价</div><div class="info-value">' + (c.calculated ? (c.calculatedPrice && c.calculatedPrice.unitPrice ? '是 · ' + c.calculatedPrice.unitPrice + '万元/㎡' : '是') : '否') + '</div></div>' +
      priceHtml +
      '<div class="info-item"><div class="info-label">是否全流程</div><div class="info-value">' + (c.fullProcess ? '是' : '否') + '</div></div>' +
      '<div class="info-item"><div class="info-label">职业</div><div class="info-value">' + escRaw(c.job || '—') + '</div></div>' +
      '<div class="info-item"><div class="info-label">年龄</div><div class="info-value">' + escRaw(c.age || '—') + '</div></div>' +
      '<div class="info-item"><div class="info-label">意向面积</div><div class="info-value">' + (c.area ? escRaw(c.area) + '㎡' : '—') + '</div></div>' +
      '<div class="info-item"><div class="info-label">意向栋数</div><div class="info-value">' + escRaw(c.buildingIntent || '—') + '</div></div>' +
      '<div class="info-item"><div class="info-label">居住小区</div><div class="info-value">' + escRaw(c.residence || '—') + '</div></div>' +
      '<div class="info-item"><div class="info-label">对比项目</div><div class="info-value">' + escRaw(c.competitor || '—') + '</div></div>' +
      '<div class="info-item"><div class="info-label">接待时长</div><div class="info-value">' + (c.visitDuration ? escRaw(c.visitDuration) + ' 分钟' : '—') + '</div></div>' +
      '<div class="info-item"><div class="info-label">接待时间</div><div class="info-value">' + (c.visitTime ? fDateTime(c.visitTime) : '—') + '</div></div>' +
      '<div class="info-item"><div class="info-label">复访次数</div><div class="info-value" style="display:flex;align-items:center;gap:6px;">' +
        '<button onclick="changeRevisit(\'' + c.id + '\',-1)" style="width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:#fff;color:var(--text-dim);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button>' +
        '<span id="rv-count-' + c.id.replace(/[^a-zA-Z0-9]/g,'') + '" style="font-size:16px;font-weight:700;min-width:20px;text-align:center;">' + (c.revisitCount || 0) + '</span>' +
        '<button onclick="changeRevisit(\'' + c.id + '\',1)" style="width:26px;height:26px;border-radius:50%;border:1.5px solid var(--gold);background:var(--gold);color:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>' +
        '<span style="font-size:12px;color:var(--text-dim);">次</span></div></div>' +
      '<div class="info-item"><div class="info-label">成交状态</div><div class="info-value">' + (c.dealStatus || '未成交') + (c.dealDate ? ' · ' + escRaw(c.dealDate) : '') + '</div></div>' +
      '<div class="info-item" style="grid-column:1/-1;"><div class="info-label">销售阶段</div><div class="info-value">' +
        SALES_STAGES.map(function(s) {
          var active = c.salesStage === s.key;
          return '<span class="stage-badge stage-' + s.key + '" style="cursor:pointer;margin-right:6px;' + (active ? 'box-shadow:0 0 0 2px var(--gold);' : 'opacity:0.6;') + '" data-stage="' + s.key + '">' + s.icon + ' ' + s.key + '</span>';
        }).join('') +
      '</div></div>' +
      (c.secondaryPhone ? '<div class="info-item"><div class="info-label">备用电话</div><div class="info-value">' + escRaw(c.secondaryPhone) + '</div></div>' : '') +
      (c.birthday ? '<div class="info-item"><div class="info-label">生日</div><div class="info-value">' + escRaw(c.birthday) + '</div></div>' : '') +
      '<div class="info-item"><div class="info-label">录入时间</div><div class="info-value">' + (c.createdAt ? fDateTime(c.createdAt) : '—') + '</div></div>' +
      followupStatusHtml +
    '</div>' +
    soaceHtml + resistanceHtml + noteHtml + followupHtml + historyHtml +
    '<div style="height:40px;"></div>';

  // Visibility
  var isManager = DB.currentUser && DB.currentUser.role === '销售经理';
  var isOwner = c.consultant === (DB.currentUser ? DB.currentUser.name : '');
  document.getElementById('detail-edit').style.display = (isManager || isOwner) ? '' : 'none';
  document.getElementById('detail-del').style.display = (isManager || isOwner) ? '' : 'none';
  document.getElementById('detail-price').style.display = (isManager || isOwner) ? '' : 'none';
  document.getElementById('detail-price').textContent = c.calculatedPrice ? '💰 查看算价' : '💰 算价格';

  var poolBtn = document.getElementById('detail-pool');
  if (c.inPool) {
    poolBtn.style.display = 'none';
  } else if (isManager || isOwner) {
    poolBtn.style.display = '';
    poolBtn.onclick = function() {
      confirmDlg('移入公共池', '确定将 <b>' + escHtml(c.name) + '</b> 移入公共池吗？其他顾问将可以看到并领取此客户。', function() {
        c.inPool = true; c.poolTime = new Date().toISOString();
        saveDB(); toast('已移入公共池', 'success');
        closeDetail(); renderCustomerList(); renderWorkbench();
      });
    };
  } else { poolBtn.style.display = 'none'; }

  var claimBtn = document.getElementById('detail-claim');
  if (c.inPool && !isManager) {
    claimBtn.style.display = '';
    claimBtn.textContent = '🎣 领取';
    claimBtn.onclick = function() {
      confirmDlg('领取客户', '确定将此客户领取到你的名下吗？', function() {
        c.inPool = false; c.consultant = DB.currentUser.name; c.claimedAt = new Date().toISOString();
        saveDB(); toast('已领取到你的名下', 'success');
        closeDetail(); renderCustomerList(); renderWorkbench();
      });
    };
  } else if (c.inPool && isManager) {
    claimBtn.style.display = '';
    claimBtn.textContent = '👤 指派';
    claimBtn.onclick = function() {
      var name = prompt('指派给哪位顾问？', '');
      if (!name) return;
      c.inPool = false; c.consultant = name.trim(); c.claimedAt = new Date().toISOString();
      saveDB(); toast('已指派给 ' + name.trim(), 'success');
      closeDetail(); renderCustomerList(); renderWorkbench();
    };
  } else { claimBtn.style.display = 'none'; }

  // Edit/Delete/Price buttons
  document.getElementById('detail-edit').onclick = function() { openForm(null, c); };
  document.getElementById('detail-price').onclick = function() { openPriceCalc(c.id); };
  document.getElementById('detail-del').onclick = function() { deleteCustomer(c.id); };

  // Stage click
  document.querySelectorAll('[data-stage]').forEach(function(el) {
    el.onclick = function() {
      var newStage = el.dataset.stage;
      if (newStage === c.salesStage) return;
      var old = c.salesStage; c.salesStage = newStage;
      if (newStage === '签约') { c.dealStatus = '签约'; if (!c.dealDate) c.dealDate = today(); }
      else if (newStage === '认购') { c.dealStatus = '认购'; }
      else { c.dealStatus = '未成交'; c.dealDate = ''; }
      addHistory(c, '阶段变更', old + ' → ' + newStage);
      saveDB(); toast('阶段：' + newStage, 'success');
      openDetail(c.id);
    };
  });

  // Quick followup
  var defMethod = document.querySelector('input[name="qf-method"][value="来访"]');
  if (defMethod) { defMethod.checked = true; defMethod.parentElement.classList.add('active'); }
  document.querySelectorAll('input[name="qf-method"]').forEach(function(r) {
    r.parentElement.onclick = function() {
      document.querySelectorAll('input[name="qf-method"]').forEach(function(x) { x.checked = false; x.parentElement.classList.remove('active'); });
      r.checked = true; r.parentElement.classList.add('active');
    };
  });
  var qfSubmit = document.getElementById('qf-submit');
  if (qfSubmit) qfSubmit.onclick = function() {
    var method = (document.querySelector('input[name="qf-method"]:checked') || {}).value || '来访';
    var content = (document.getElementById('qf-content').value || '').trim();
    var nextDate = (document.getElementById('qf-next').value || '').trim();
    if (!content) { toast('请填写跟进内容', 'error'); return; }
    addFollowUp(c, method, content, nextDate);
    saveDB(); toast('跟进已记录', 'success');
    openDetail(c.id);
  };
}

function closeDetail() {
  document.getElementById('detail-page').classList.remove('active');
  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('bottom-nav').classList.remove('hidden');
  document.getElementById('topbar-title').textContent = getTabTitle(currentTab);
  showTab(currentTab);
}

function changeRevisit(cid, delta) {
  var c = DB.customers.find(function(x) { return x.id === cid; });
  if (!c) return;
  c.revisitCount = Math.max(0, (c.revisitCount || 0) + delta);
  saveDB();
  var el = document.getElementById('rv-count-' + cid.replace(/[^a-zA-Z0-9]/g, ''));
  if (el) el.textContent = c.revisitCount;
}

function deleteCustomer(customerId) {
  var c = DB.customers.find(function(x) { return x.id === customerId; });
  if (!c) return;
  confirmDlg('删除确认', '确定要删除 <b>' + escHtml(c.name) + '</b> 吗？此操作无法撤销。', function() {
    DB.customers = DB.customers.filter(function(x) { return x.id !== customerId; });
    saveDB(); closeDetail(); renderCustomerList(); renderWorkbench();
    toast('已删除', 'success');
  });
}
